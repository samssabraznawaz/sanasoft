<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="SaNaSoft-ANN: free, guided artificial neural network analysis for PLS-SEM + ANN research, implementing Leong et al. (2025). Developed by Prof. S. Sabraz Nawaz and Prof. Ghazanfar Ali.">
<title>SaNaSoft-ANN: guided neural network analysis for PLS-SEM latent variable scores (developed by Prof. S. Sabraz Nawaz and Prof. Ghazanfar Ali)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#1a237e;--primary-light:#3949ab;--primary-pale:#e8eaf6;
  --accent:#e65100;--accent-light:#ff8f00;
  --success:#2e7d32;--warning:#f57f17;--error:#c62828;
  --bg:#f0f2f8;--card:#fff;--border:#dde1f0;
  --text:#1c1e2d;--muted:#6b7280;--hint:#5c6bc0;
  --radius:12px;--shadow:0 2px 12px rgba(26,35,126,.10);
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
/* ── HEADER ─────────────────────────────────────── */
header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;padding:14px 28px;display:flex;align-items:center;gap:16px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.logo{font-size:22px;font-weight:700;letter-spacing:-.5px}
.logo span{color:#ffb74d}
.tagline{font-size:12px;opacity:.8;margin-top:2px}
header .badge{margin-left:auto;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:500}
/* ── PROGRESS BAR ───────────────────────────────── */
#progress-bar{background:#fff;border-bottom:1px solid var(--border);padding:12px 28px;display:flex;align-items:center;gap:0;overflow-x:auto}
.step-pill{display:flex;align-items:center;gap:0;flex-shrink:0}
.step-dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--muted);transition:.3s;cursor:default;position:relative}
.step-dot.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-pale)}
.step-dot.done{background:var(--success);border-color:var(--success);color:#fff}
.step-dot.done::after{content:'✓';font-size:13px}
.step-dot.done span{display:none}
.step-label{font-size:10px;color:var(--muted);margin:0 4px;white-space:nowrap;max-width:70px;text-align:center;line-height:1.2}
.step-label.active{color:var(--primary);font-weight:600}
.step-connector{width:20px;height:2px;background:var(--border);flex-shrink:0}
.step-connector.done{background:var(--success)}
/* ── LAYOUT ─────────────────────────────────────── */
#main{display:grid;grid-template-columns:260px 1fr;gap:0;min-height:calc(100vh - 110px)}
#sidebar{background:#fff;border-right:1px solid var(--border);padding:20px 16px;display:flex;flex-direction:column;gap:8px}
.sidebar-step{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:.2s;border:1px solid transparent}
.sidebar-step:hover{background:var(--primary-pale)}
.sidebar-step.active{background:var(--primary-pale);border-color:var(--primary);color:var(--primary)}
.sidebar-step.done{color:var(--success)}
.sidebar-step .snum{width:22px;height:22px;border-radius:50%;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;margin-top:1px}
.sidebar-step.active .snum{background:var(--primary);color:#fff}
.sidebar-step.done .snum{background:var(--success);color:#fff}
.sidebar-step .stitle{font-size:12px;font-weight:600;line-height:1.3}
.sidebar-step .sdesc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.sidebar-step.active .sdesc{color:var(--primary-light);opacity:.9}
#content{padding:28px;overflow-y:auto;max-height:calc(100vh - 110px)}
/* ── CARDS ──────────────────────────────────────── */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;border:1px solid var(--border)}
.card-title{font-size:17px;font-weight:700;color:var(--primary);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:var(--muted);margin-bottom:18px}
/* ── HINTS ──────────────────────────────────────── */
.hint-box{background:#e8eaf6;border-left:4px solid var(--primary-light);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:12.5px;color:#283593;line-height:1.6}
.hint-box strong{color:var(--primary)}
.tip-box{background:#fff8e1;border-left:4px solid var(--warning);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:12.5px;color:#5f4000;line-height:1.6}
.warn-box{background:#ffebee;border-left:4px solid var(--error);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:12.5px;color:#7f0000;line-height:1.6}
.ok-box{background:#e8f5e9;border-left:4px solid var(--success);border-radius:0 8px 8px 0;padding:10px 14px;margin:10px 0;font-size:12.5px;color:#1b5e20;line-height:1.6}
/* ── FORM ELEMENTS ──────────────────────────────── */
label.field-label{display:block;font-size:12px;font-weight:600;color:var(--text);margin-bottom:4px}
.field-hint{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic}
input[type=text],input[type=number],select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:inherit;font-size:13.5px;color:var(--text);background:#fff;transition:.2s;outline:none}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{border-color:var(--primary-light);box-shadow:0 0 0 3px var(--primary-pale)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.form-group{margin-bottom:14px}
/* ── BUTTONS ─────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border-radius:8px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;transition:.2s;border:none;text-decoration:none}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-light);transform:translateY(-1px)}
.btn-accent{background:var(--accent);color:#fff;padding:13px 32px;font-size:15px;border-radius:10px}
.btn-accent:hover{background:var(--accent-light);transform:translateY(-1px);box-shadow:0 4px 16px rgba(230,81,0,.3)}
.btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary)}
.btn-outline:hover{background:var(--primary-pale)}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:6px 14px;font-size:12px}
.btn-group{display:flex;gap:10px;margin-top:20px}
/* ── TABLES ─────────────────────────────────────── */
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--primary);color:#fff;padding:9px 12px;text-align:left;font-weight:600;font-size:12px}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
tr:hover td{background:#f8f9ff}
tr:nth-child(even) td{background:#fafbff}
/* ── UPLOAD ZONE ─────────────────────────────────── */
#drop-zone{border:2.5px dashed var(--border);border-radius:var(--radius);padding:40px;text-align:center;cursor:pointer;transition:.2s;background:#fafbff}
#drop-zone:hover,#drop-zone.dragover{border-color:var(--primary);background:var(--primary-pale)}
#drop-zone .dz-icon{font-size:40px;margin-bottom:10px}
#drop-zone .dz-text{font-size:14px;font-weight:600;color:var(--primary)}
#drop-zone .dz-sub{font-size:12px;color:var(--muted);margin-top:4px}
/* ── VARIABLE BOXES ──────────────────────────────── */
.var-pool{min-height:80px;border:2px dashed var(--border);border-radius:10px;padding:10px;background:#fafbff;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.var-chip{display:inline-flex;align-items:center;gap:6px;background:var(--primary-pale);color:var(--primary);border:1px solid var(--primary-light);border-radius:6px;padding:4px 10px;font-size:12px;font-weight:600;cursor:grab;user-select:none;transition:.2s}
.var-chip:hover{background:var(--primary);color:#fff}
.var-chip .chip-rm{cursor:pointer;opacity:.7;margin-left:2px}
.var-chip .chip-rm:hover{opacity:1}
.var-chip.factor{background:#fce4ec;color:#880e4f;border-color:#f48fb1}
.var-chip.dep{background:#e8f5e9;color:#1b5e20;border-color:#a5d6a7}
/* ── TABS ────────────────────────────────────────── */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto}
.tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab:hover{color:var(--primary-light)}
.tab-pane{display:none}
.tab-pane.active{display:block}
/* ── PARTITION VISUAL ────────────────────────────── */
#partition-bar{height:36px;border-radius:10px;overflow:hidden;display:flex;margin:16px 0;border:1px solid var(--border)}
#part-train{background:#1a237e;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:.4s}
#part-test{background:#ff8f00;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:.4s}
#part-holdout{background:#2e7d32;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;transition:.4s}
/* ── COMPLIANCE CHECKER ──────────────────────────── */
.compliance-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;margin:4px 0;font-size:13px}
.compliance-item.pass{background:#e8f5e9;color:#1b5e20}
.compliance-item.fail{background:#ffebee;color:#c62828}
.compliance-item.warn{background:#fff8e1;color:#5f4000}
.compliance-icon{font-size:15px;flex-shrink:0}
/* ── NETWORK DIAGRAM ─────────────────────────────── */
#network-canvas{width:100%;border-radius:10px;background:#f8f9ff;border:1px solid var(--border)}
/* ── RESULTS ─────────────────────────────────────── */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:12px 0}
.metric-card{background:var(--primary-pale);border-radius:10px;padding:14px;text-align:center;border:1px solid rgba(26,35,126,.15)}
.metric-val{font-size:24px;font-weight:700;color:var(--primary);font-family:'JetBrains Mono',monospace}
.metric-lbl{font-size:11px;color:var(--muted);margin-top:4px;font-weight:500}
/* ── PROGRESS SPINNER ────────────────────────────── */
#run-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:center;justify-content:center;flex-direction:column;gap:16px;color:#fff}
#run-overlay.show{display:flex}
.spinner{width:52px;height:52px;border:5px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#run-progress-text{font-size:15px;font-weight:500;text-align:center}
/* ── REPORT ──────────────────────────────────────── */
#report-output{background:#fff;border:1px solid var(--border);border-radius:10px;padding:32px;font-family:'Times New Roman',serif;font-size:14px;line-height:1.8;white-space:pre-wrap;max-height:60vh;overflow-y:auto}
/* ── MISC ────────────────────────────────────────── */
.section-title{font-size:13px;font-weight:700;color:var(--primary);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--primary-pale);text-transform:uppercase;letter-spacing:.5px}
.badge-pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600}
.badge-primary{background:var(--primary-pale);color:var(--primary)}
.badge-success{background:#e8f5e9;color:var(--success)}
.badge-warn{background:#fff8e1;color:var(--warning)}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.hidden{display:none!important}
.slider-row{display:flex;align-items:center;gap:12px}
input[type=range]{flex:1;accent-color:var(--primary)}
.num-display{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--primary);min-width:40px;text-align:right}
.toggle-switch{position:relative;display:inline-block;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0}
.toggle-slider{position:absolute;inset:0;background:#ccc;border-radius:24px;cursor:pointer;transition:.3s}
.toggle-slider::before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.3s}
.toggle-switch input:checked+.toggle-slider{background:var(--primary)}
.toggle-switch input:checked+.toggle-slider::before{transform:translateX(20px)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.toggle-row:last-child{border:none}
.toggle-label{font-size:13px;font-weight:500}
.toggle-sub{font-size:11px;color:var(--muted);margin-top:2px}
canvas{max-width:100%}
@media(max-width:768px){
  #main{grid-template-columns:1fr}
  #sidebar{display:none}
  .form-row,.row-2,.row-3{grid-template-columns:1fr}
}
/* ── TUTORIAL MODAL ──────────────────────────────── */
#tutorial-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:1000;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
#tutorial-overlay.show{display:flex}
#tutorial-modal{background:#fff;border-radius:16px;width:100%;max-width:960px;box-shadow:0 24px 64px rgba(0,0,0,.3);overflow:hidden;margin:auto}
.tut-header{background:linear-gradient(135deg,#1a237e 0%,#3949ab 100%);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between}
.tut-header h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.tut-header .tut-badge{background:rgba(255,255,255,.2);border-radius:20px;padding:4px 14px;font-size:11px}
.tut-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.tut-close:hover{background:rgba(255,255,255,.3)}
.tut-nav{background:#f0f2f8;border-bottom:1px solid #dde1f0;padding:12px 20px;display:flex;gap:4px;overflow-x:auto}
.tut-tab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:none;background:transparent;color:#6b7280;white-space:nowrap;transition:.2s}
.tut-tab.active{background:#1a237e;color:#fff}
.tut-tab:hover:not(.active){background:#e8eaf6;color:#1a237e}
.tut-body{padding:24px 28px}
.tut-step-title{font-size:20px;font-weight:700;color:#1a237e;margin-bottom:6px}
.tut-step-sub{font-size:13px;color:#6b7280;margin-bottom:20px;line-height:1.5}
.tut-compare{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
@media(max-width:700px){.tut-compare{grid-template-columns:1fr}}
.tut-panel{border:1.5px solid #dde1f0;border-radius:12px;overflow:hidden}
.tut-panel-header{padding:10px 14px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.tut-panel.spss .tut-panel-header{background:#d32f2f;color:#fff}
.tut-panel.sana .tut-panel-header{background:#1a237e;color:#fff}
.tut-panel-body{padding:14px;background:#fafbff}
.spss-mockup{background:#f5f5f5;border:1px solid #bbb;border-radius:6px;font-family:'Segoe UI',Arial,sans-serif;font-size:12px;overflow:hidden}
.spss-titlebar{background:linear-gradient(180deg,#1565c0,#0d47a1);color:#fff;padding:5px 10px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:6px}
.spss-menu{background:#e9e9e9;border-bottom:1px solid #ccc;padding:3px 8px;display:flex;gap:12px;font-size:11px}
.spss-menu span{cursor:default;padding:2px 4px}
.spss-menu span:hover{background:#c5cae9}
.spss-tabs{display:flex;border-bottom:1px solid #999;background:#d5d5d5;padding:0 8px;gap:2px;margin-top:4px}
.spss-tab{padding:4px 12px;font-size:11px;border:1px solid #999;border-bottom:none;background:#c8c8c8;cursor:default;border-radius:3px 3px 0 0}
.spss-tab.active{background:#f5f5f5;font-weight:700;border-bottom:1px solid #f5f5f5;margin-bottom:-1px}
.spss-content{padding:10px;background:#f5f5f5}
.spss-group{border:1px solid #999;border-radius:3px;margin-bottom:8px;overflow:hidden}
.spss-group-title{background:#ddd;padding:3px 8px;font-size:10px;font-weight:700;border-bottom:1px solid #ccc;color:#333}
.spss-group-body{padding:8px;display:flex;flex-direction:column;gap:4px}
.spss-radio{display:flex;align-items:center;gap:5px;font-size:11px}
.spss-radio input[type=radio]{margin:0;pointer-events:none}
.spss-field{display:flex;align-items:center;justify-content:space-between;font-size:11px;padding:2px 0}
.spss-field input[type=text]{width:50px;font-size:11px;border:1px solid #999;padding:1px 3px;pointer-events:none;font-family:inherit}
.spss-check{display:flex;align-items:center;gap:5px;font-size:11px}
.spss-check input[type=checkbox]{margin:0;pointer-events:none}
.spss-btn-row{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}
.spss-btn{padding:3px 14px;font-size:11px;border:1px solid #999;background:#e9e9e9;border-radius:2px;cursor:default}
.spss-btn.primary{background:#1565c0;color:#fff;border-color:#0d47a1}
.sana-step-ref{background:#e8eaf6;border-radius:8px;padding:10px 14px;font-size:13px;color:#1a237e;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sana-step-num{background:#1a237e;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0}
.arrow-badge{display:inline-flex;align-items:center;justify-content:center;font-size:22px;color:#1a237e;margin:0 6px}
.tut-key-points{background:#e8f5e9;border-left:4px solid #2e7d32;border-radius:0 8px 8px 0;padding:10px 14px;margin:14px 0;font-size:12.5px;color:#1b5e20}
.tut-key-points strong{display:block;margin-bottom:4px;font-size:13px}
.tut-warning{background:#fff8e1;border-left:4px solid #f57f17;border-radius:0 8px 8px 0;padding:10px 14px;margin:14px 0;font-size:12.5px;color:#5f4000}
.tut-footer{padding:16px 28px;background:#f8f9ff;border-top:1px solid #dde1f0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tut-footer .tut-counter{font-size:12px;color:#6b7280;font-weight:600}
.tut-nav-btns{display:flex;gap:10px}
.figure-label{font-size:10px;color:#6b7280;text-align:center;margin-top:4px;font-style:italic}
.tut-flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.tut-flow-step{background:#e8eaf6;color:#1a237e;border:1px solid #c5cae9;border-radius:6px;padding:5px 10px;font-size:11px;font-weight:600;white-space:nowrap}
.tut-flow-arr{color:#9e9e9e;font-size:14px}
.spss-listbox{border:1px inset #999;background:#fff;height:80px;overflow-y:auto;font-size:11px;padding:2px}
.spss-listbox div{padding:1px 4px;cursor:default}
.spss-listbox div.sel{background:#1565c0;color:#fff}
.spss-transfer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.spss-transfer button{padding:2px 8px;font-size:10px;border:1px solid #999;background:#e9e9e9;cursor:default;border-radius:2px}
.tut-table{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
.tut-table th{background:#1a237e;color:#fff;padding:6px 10px;text-align:left}
.tut-table td{padding:6px 10px;border-bottom:1px solid #e0e0e0}
.tut-table tr:nth-child(even) td{background:#f8f9ff}
.highlight-cell{background:#fff9c4!important;font-weight:700}

/* ── v2 ADDITIONS ─────────────────────────────────── */
header .hbtn{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:.2s}
header .hbtn:hover{background:rgba(255,255,255,.28)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}
.model-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}

<script id="engine-src" type="text/plain">
// ═══════════════════════════════════════════════════════════════════
// SaNaSoft-ANN ENGINE v2 — pure JavaScript multilayer perceptron
// Float64 precision, seeded & reproducible, runs inside a Web Worker.
// Algorithms: FFBP (gradient descent + momentum), SCG (Møller, 1993), Adam.
// ═══════════════════════════════════════════════════════════════════
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const ACT_CODE={sigmoid:0,tanh:1,relu:2,identity:3,linear:3};
function sig(z){if(z>=0){return 1/(1+Math.exp(-z));}const e=Math.exp(z);return e/(1+e);}
function actF(c,z){return c===0?sig(z):c===1?Math.tanh(z):c===2?(z>0?z:0):z;}
function actD(c,a){return c===0?a*(1-a):c===1?1-a*a:c===2?(a>0?1:0):1;}

function Net(sizes,hAct,oAct){
  this.sizes=sizes.slice();this.L=sizes.length-1;
  this.hCode=ACT_CODE[hAct]??0;this.oCode=ACT_CODE[oAct]??0;
  this.off=[];let o=0;
  for(let l=0;l<this.L;l++){this.off.push(o);o+=(sizes[l]+1)*sizes[l+1];}
  this.nParams=o;
  this.isBias=new Uint8Array(o);
  for(let l=0;l<this.L;l++){const nIn=sizes[l],st=nIn+1;for(let j=0;j<sizes[l+1];j++)this.isBias[this.off[l]+j*st+nIn]=1;}
  this.A=[];this.D=[];
  for(let l=0;l<=this.L;l++){this.A.push(new Float64Array(sizes[l]));this.D.push(new Float64Array(sizes[l]));}
}
Net.prototype.init=function(rng,center,offset){
  const t=new Float64Array(this.nParams);
  for(let i=0;i<t.length;i++)t[i]=center+(2*rng()-1)*offset;
  return t;
};
Net.prototype.forward=function(th,X,r){
  const s=this.sizes,L=this.L,A=this.A,p=s[0],a0=A[0],base=r*p;
  for(let i=0;i<p;i++)a0[i]=X[base+i];
  for(let l=0;l<L;l++){
    const nIn=s[l],nOut=s[l+1],ain=A[l],aout=A[l+1],off=this.off[l],st=nIn+1;
    const c=(l===L-1)?this.oCode:this.hCode;
    for(let j=0;j<nOut;j++){
      const o=off+j*st;let z=th[o+nIn];
      for(let i=0;i<nIn;i++)z+=th[o+i]*ain[i];
      aout[j]=c===0?sig(z):c===1?Math.tanh(z):c===2?(z>0?z:0):z;
    }
  }
  return A[L][0];
};
Net.prototype.backward=function(th,g,err){
  const s=this.sizes,L=this.L,A=this.A,D=this.D;
  D[L][0]=err*actD(this.oCode,A[L][0]);
  for(let l=L-1;l>=0;l--){
    const nIn=s[l],nOut=s[l+1],ain=A[l],dout=D[l+1],off=this.off[l],st=nIn+1;
    if(l>0){
      const din=D[l];for(let i=0;i<nIn;i++)din[i]=0;
      for(let j=0;j<nOut;j++){const dj=dout[j];const o=off+j*st;
        for(let i=0;i<nIn;i++){g[o+i]+=dj*ain[i];din[i]+=dj*th[o+i];}
        g[o+nIn]+=dj;}
      const hc=this.hCode;for(let i=0;i<nIn;i++)din[i]*=actD(hc,ain[i]);
    }else{
      for(let j=0;j<nOut;j++){const dj=dout[j];const o=off+j*st;
        for(let i=0;i<nIn;i++)g[o+i]+=dj*ain[i];
        g[o+nIn]+=dj;}
    }
  }
};
// E = ½·SSE/m + ½·λ·Σw²   (biases not penalised)
Net.prototype.lossGrad=function(th,X,Y,idx,from,to,g,l2){
  g.fill(0);let sse=0;const m=to-from;
  for(let k=from;k<to;k++){const r=idx?idx[k]:k;const e=this.forward(th,X,r)-Y[r];sse+=e*e;this.backward(th,g,e);}
  const sc=1/m;for(let i=0;i<g.length;i++)g[i]*=sc;
  let E=0.5*sse/m;
  if(l2>0){const ib=this.isBias;let w2=0;for(let i=0;i<g.length;i++)if(!ib[i]){g[i]+=l2*th[i];w2+=th[i]*th[i];}E+=0.5*l2*w2;}
  return E;
};
Net.prototype.loss=function(th,X,Y,n,l2){
  let sse=0;for(let r=0;r<n;r++){const e=this.forward(th,X,r)-Y[r];sse+=e*e;}
  let E=0.5*sse/n;
  if(l2>0){const ib=this.isBias;let w2=0;for(let i=0;i<th.length;i++)if(!ib[i])w2+=th[i]*th[i];E+=0.5*l2*w2;}
  return E;
};
Net.prototype.sse=function(th,X,Y,n){let s=0;for(let r=0;r<n;r++){const e=this.forward(th,X,r)-Y[r];s+=e*e;}return s;};
Net.prototype.predict=function(th,X,n){const o=new Float64Array(n);for(let r=0;r<n;r++)o[r]=this.forward(th,X,r);return o;};

function dot(a,b){let s=0;for(let i=0;i<a.length;i++)s+=a[i]*b[i];return s;}

// ───────────────────────── TRAINING ─────────────────────────
// d = {Xtr,Ytr,ntr,Xte,Yte,nte}; early stopping monitors the TESTING sample (as SPSS does).
function trainNet(net,d,cfg,rng){
  const t0=Date.now();
  let th=net.init(rng,cfg.initCenter,cfg.initOffset);
  const P=net.nParams,g=new Float64Array(P);
  const hasTe=d.nte>0;
  const histTr=[],histTe=[];
  let best=Infinity,bestTh=th.slice(),bestEp=0,noImp=0,stop='Maximum number of epochs reached',ep=0;
  const monitor=()=>{
    const mTr=net.sse(th,d.Xtr,d.Ytr,d.ntr)/d.ntr;
    const mTe=hasTe?net.sse(th,d.Xte,d.Yte,d.nte)/d.nte:mTr;
    histTr.push(mTr);histTe.push(mTe);
    if(mTe<best-1e-12){best=mTe;bestTh.set(th);bestEp=ep;noImp=0;}else noImp++;
    if(noImp>=cfg.patience&&ep>=(cfg.minEpochs||0)){stop=`${cfg.patience} consecutive epoch(s) with no decrease in error${hasTe?' (testing sample)':''}`;return true;}
    const w=50;const L=histTr.length;
    if(cfg.minRelChange>0&&L>Math.max(2*w,cfg.minEpochs||0)){const a=histTr[L-1-w],b=histTr[L-1];if(a>0&&(a-b)/a<cfg.minRelChange){stop='Relative change in training error criterion';return true;}}
    if(Date.now()-t0>cfg.maxTimeMs){stop='Maximum training time exceeded';return true;}
    return false;
  };
  const alg=cfg.algorithm;
  if(alg==='scg'){
    // Møller (1993) scaled conjugate gradient — batch only
    const s=new Float64Array(P),p=new Float64Array(P),r=new Float64Array(P),rOld=new Float64Array(P),wN=new Float64Array(P),g2=new Float64Array(P);
    let E=net.lossGrad(th,d.Xtr,d.Ytr,null,0,d.ntr,g,cfg.l2);
    for(let i=0;i<P;i++){p[i]=-g[i];r[i]=-g[i];}
    let lambda=cfg.scgLambda,lambdaBar=0,success=true,delta=0;const sigma0=cfg.scgSigma;
    for(ep=1;ep<=cfg.maxEpochs;ep++){
      const pn2=dot(p,p);
      if(pn2<1e-30){stop='Error gradient vanished (converged)';monitor();break;}
      if(success){
        const sg=sigma0/Math.sqrt(pn2);
        for(let i=0;i<P;i++)wN[i]=th[i]+sg*p[i];
        net.lossGrad(wN,d.Xtr,d.Ytr,null,0,d.ntr,g2,cfg.l2);
        for(let i=0;i<P;i++)s[i]=(g2[i]-g[i])/sg;
        delta=dot(p,s);
      }
      delta+=(lambda-lambdaBar)*pn2;
      if(delta<=0){lambdaBar=2*(lambda-delta/pn2);delta=-delta+lambda*pn2;lambda=lambdaBar;}
      const mu=dot(p,r),alpha=mu/delta;
      for(let i=0;i<P;i++)wN[i]=th[i]+alpha*p[i];
      const En=net.loss(wN,d.Xtr,d.Ytr,d.ntr,cfg.l2);
      const Delta=2*delta*(E-En)/(mu*mu);
      if(Delta>=0){
        th.set(wN);E=En;rOld.set(r);
        E=net.lossGrad(th,d.Xtr,d.Ytr,null,0,d.ntr,g,cfg.l2);
        for(let i=0;i<P;i++)r[i]=-g[i];
        lambdaBar=0;success=true;
        if(ep%P===0){p.set(r);}else{const beta=(dot(r,r)-dot(r,rOld))/mu;for(let i=0;i<P;i++)p[i]=r[i]+beta*p[i];}
        if(Delta>=0.75)lambda=Math.max(lambda/4,1e-15);
      }else{lambdaBar=lambda;success=false;}
      if(Delta<0.25)lambda=Math.min(lambda+delta*(1-Delta)/pn2,1e100);
      if(monitor())break;
    }
  }else{
    const n=d.ntr;
    const bs=cfg.type==='online'?1:cfg.type==='minibatch'?Math.max(1,Math.min(cfg.batchSize,n)):n;
    const idx=new Int32Array(n);for(let i=0;i<n;i++)idx[i]=i;
    const v=new Float64Array(P);
    const m1=new Float64Array(P),m2=new Float64Array(P);let tAdam=0;
    const b1=0.9,b2=0.999,eps=1e-8;
    for(ep=1;ep<=cfg.maxEpochs;ep++){
      if(bs<n){for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1));const tmp=idx[i];idx[i]=idx[j];idx[j]=tmp;}}
      // SPSS-style learning-rate reduction for online / mini-batch training
      let lr=alg==='adam'?cfg.adamLr:cfg.lr;
      if(alg!=='adam'&&bs<n&&cfg.lrReductionEpochs>0&&cfg.lrLower<lr){lr=Math.max(cfg.lrLower,lr*Math.pow(cfg.lrLower/lr,Math.min(1,(ep-1)/cfg.lrReductionEpochs)));}
      for(let b=0;b<n;b+=bs){
        const e=Math.min(n,b+bs);
        net.lossGrad(th,d.Xtr,d.Ytr,bs<n?idx:null,b,e,g,cfg.l2);
        if(alg==='adam'){
          tAdam++;const c1=1-Math.pow(b1,tAdam),c2=1-Math.pow(b2,tAdam);
          for(let i=0;i<P;i++){m1[i]=b1*m1[i]+(1-b1)*g[i];m2[i]=b2*m2[i]+(1-b2)*g[i]*g[i];th[i]-=lr*(m1[i]/c1)/(Math.sqrt(m2[i]/c2)+eps);}
        }else{
          const mom=cfg.momentum;
          for(let i=0;i<P;i++){v[i]=mom*v[i]-lr*g[i];th[i]+=v[i];}
        }
      }
      if(monitor())break;
    }
  }
  if(ep>cfg.maxEpochs)ep=cfg.maxEpochs;
  return {theta:bestTh,bestEpoch:bestEp,epochs:Math.min(ep,cfg.maxEpochs),stopReason:stop,ms:Date.now()-t0,histTr,histTe};
}

// ───────────────── PERMUTATION SENSITIVITY ANALYSIS ─────────────────
// Importance of each input variable (dummy groups are permuted jointly, like SPSS
// treats a factor as one predictor). Raw ΔSSE → importance summing to 1.
function sensitivity(net,th,X,Y,n,p,groups,repeats,rng){
  const base=net.sse(th,X,Y,n);
  const Xp=X.slice();const perm=new Int32Array(n);const raw=[];
  for(const grp of groups){
    let acc=0;
    for(let rep=0;rep<repeats;rep++){
      for(let i=0;i<n;i++)perm[i]=i;
      for(let i=n-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=perm[i];perm[i]=perm[j];perm[j]=t;}
      for(let r=0;r<n;r++){const src=perm[r]*p,dst=r*p;for(const c of grp.cols)Xp[dst+c]=X[src+c];}
      acc+=net.sse(th,Xp,Y,n)-base;
    }
    for(let r=0;r<n;r++){const b=r*p;for(const c of grp.cols)Xp[b+c]=X[b+c];}
    raw.push(Math.max(0,acc/repeats));
  }
  const tot=raw.reduce((a,b)=>a+b,0);
  const imp=raw.map(v=>tot>0?v/tot:1/raw.length);
  const mx=Math.max(...imp)||1;
  return {raw,importance:imp,normalized:imp.map(v=>v/mx*100),baseSSE:base};
}

// ───────────────────────── HELPERS ─────────────────────────
function mean(a){let s=0;for(const v of a)s+=v;return a.length?s/a.length:0;}
function sd(a){if(a.length<2)return 0;const m=mean(a);let s=0;for(const v of a)s+=(v-m)*(v-m);return Math.sqrt(s/(a.length-1));}
function sst(Y,n){let m=0;for(let i=0;i<n;i++)m+=Y[i];m/=n;let s=0;for(let i=0;i<n;i++)s+=(Y[i]-m)*(Y[i]-m);return s;}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function subset(X,Y,p,rows){
  const n=rows.length,Xs=new Float64Array(n*p),Ys=new Float64Array(n);
  for(let k=0;k<n;k++){const r=rows[k];Ys[k]=Y[r];for(let c=0;c<p;c++)Xs[k*p+c]=X[r*p+c];}
  return {X:Xs,Y:Ys,n};
}
function downsample(a,maxPts){if(a.length<=maxPts)return a.map(v=>+v.toPrecision(6));const out=[];const step=a.length/maxPts;for(let i=0;i<maxPts;i++)out.push(+a[Math.floor(i*step)].toPrecision(6));out.push(+a[a.length-1].toPrecision(6));return out;}

// Rescale covariates and the dependent variable using the analysis sample (non-holdout cases)
function rescale(model,S,analysisRows){
  const {p,n}=model;const X=Float64Array.from(model.X),Y=Float64Array.from(model.Y);
  const colInfo=[];
  for(let c=0;c<p;c++){
    const meta=model.cols[c];
    if(meta.kind!=='cov'||S.covRescale==='none'){colInfo.push({type:'none'});continue;}
    let mn=Infinity,mx=-Infinity,m=0;
    for(const r of analysisRows){const v=X[r*p+c];if(v<mn)mn=v;if(v>mx)mx=v;m+=v;}
    m/=analysisRows.length;let s2=0;for(const r of analysisRows){const v=X[r*p+c];s2+=(v-m)*(v-m);}
    const s=Math.sqrt(s2/Math.max(1,analysisRows.length-1))||1;
    let a=0,b=1;
    if(S.covRescale==='standardized'){a=m;b=s;}
    else if(S.covRescale==='normalized'){a=mn;b=(mx-mn)||1;}
    else if(S.covRescale==='adjnormalized'){a=(mx+mn)/2;b=((mx-mn)/2)||1;}
    for(let r=0;r<n;r++)X[r*p+c]=(X[r*p+c]-a)/b;
    colInfo.push({type:S.covRescale,a,b,mean:m,sd:s,min:mn,max:mx});
  }
  // Dependent: sigmoid output ⇒ normalized [0,1] (SPSS enforces this); tanh ⇒ adjusted normalized [-1,1]
  let dvMode=S.dvRescale;
  if(S.oAct==='sigmoid')dvMode='normalized';
  if(S.oAct==='tanh')dvMode='adjnormalized';
  let mn=Infinity,mx=-Infinity,m=0;
  for(const r of analysisRows){const v=Y[r];if(v<mn)mn=v;if(v>mx)mx=v;m+=v;}
  m/=analysisRows.length;let s2=0;for(const r of analysisRows)s2+=(Y[r]-m)**2;const s=Math.sqrt(s2/Math.max(1,analysisRows.length-1))||1;
  let a=0,b=1;
  if(dvMode==='normalized'){a=mn;b=(mx-mn)||1;}
  else if(dvMode==='adjnormalized'){a=(mx+mn)/2;b=((mx-mn)/2)||1;}
  else if(dvMode==='standardized'){a=m;b=s;}
  for(let r=0;r<n;r++)Y[r]=(Y[r]-a)/b;
  return {X,Y,colInfo,dv:{mode:dvMode,a,b,mean:m,sd:s,min:mn,max:mx}};
}

function makeSplits(n,S,rng){
  const all=shuffled(Array.from({length:n},(_,i)=>i),rng);
  const nH=Math.round(n*(S.holdout||0)/100);
  const hold=all.slice(0,nH),ana=all.slice(nH);
  const K=S.networks;const splits=[];
  if(S.scheme==='kfold'){
    const nA=ana.length;
    for(let k=0;k<K;k++){
      const s=Math.floor(k*nA/K),e=Math.floor((k+1)*nA/K);
      splits.push({train:ana.slice(0,s).concat(ana.slice(e)),test:ana.slice(s,e)});
    }
  }else{
    const trShare=S.training/(S.training+S.test);
    for(let k=0;k<K;k++){
      const sh=shuffled(ana,rng);const nTr=Math.max(2,Math.min(sh.length-1,Math.round(sh.length*trShare)));
      splits.push({train:sh.slice(0,nTr),test:sh.slice(nTr)});
    }
  }
  return {hold,ana,splits};
}

function trainCfg(S,overrides){
  return Object.assign({
    algorithm:S.algorithm,type:S.algorithm==='scg'?'batch':S.type,batchSize:S.batchSize,
    lr:S.lr,momentum:S.momentum,lrLower:S.lrLower,lrReductionEpochs:S.lrReductionEpochs,adamLr:S.adamLr,
    scgLambda:S.scgLambda,scgSigma:S.scgSigma,maxEpochs:S.maxEpochs,patience:S.patience,
    minRelChange:S.minRelChange,minEpochs:S.minEpochs,maxTimeMs:S.maxTimeMin*60000,l2:S.l2,
    initCenter:S.initCenter??0,initOffset:S.initOffset??0.5
  },overrides||{});
}

// Automatic selection of hidden-unit counts: small grid search, evaluated by
// mean testing MSE on the first three data splits (quick training).
async function autoArchitecture(model,R,sp,S,hooks,label,mi){
  const p=model.p,cands=[];
  const maxH1=Math.max(2,Math.min(S.autoMax||8,2*model.groups.length+2));
  const h1s=[1,2,3,4,5,6,8,10,12].filter(h=>h<=maxH1);
  if(S.hiddenLayers===1){h1s.forEach(h=>cands.push([h]));}
  else{for(const h1 of h1s)for(let h2=1;h2<=Math.min(h1,S.autoMax2||4);h2++)cands.push([h1,h2]);}
  const folds=sp.splits.slice(0,Math.min(2,sp.splits.length));
  const cfg=trainCfg(S,{maxEpochs:Math.min(S.maxEpochs,400),patience:30,minEpochs:Math.min(S.minEpochs||0,100),maxTimeMs:15000});
  const grid=[];
  for(let ci=0;ci<cands.length;ci++){
    const hs=cands[ci];let acc=0;
    for(let f=0;f<folds.length;f++){
      const tr=subset(R.X,R.Y,p,folds[f].train),te=subset(R.X,R.Y,p,folds[f].test);
      const net=new Net([p,...hs,1],S.hAct,S.oAct);
      const res=trainNet(net,{Xtr:tr.X,Ytr:tr.Y,ntr:tr.n,Xte:te.X,Yte:te.Y,nte:te.n},cfg,mulberry32(S.seed*31+ci*7+f));
      acc+=net.sse(res.theta,te.X,te.Y,te.n)/te.n;
    }
    grid.push({units:hs,testMSE:acc/folds.length,params:new Net([p,...hs,1],S.hAct,S.oAct).nParams});
    if(hooks.progress)hooks.progress({phase:'arch',msg:`${label}: evaluating hidden-unit configuration ${hs.join('–')} (${ci+1}/${cands.length})`,frac:(ci+1)/cands.length,model:mi});
    await hooks.tick();
  }
  // parsimony: smallest network whose testing error is within 2% of the best
  const bestV=Math.min(...grid.map(g=>g.testMSE));
  const ok=grid.filter(g=>g.testMSE<=bestV*1.02).sort((a,b)=>a.params-b.params);
  return {units:ok[0].units,grid,criterion:'smallest network within 2% of the lowest mean testing MSE'};
}

// ───────────────────────── MAIN JOB ─────────────────────────
async function runJob(job,hooks){
  hooks=hooks||{};hooks.tick=hooks.tick||(()=>Promise.resolve());
  const S=job.settings;const out={models:[],engine:'SaNaSoft-ANN engine v2 (JavaScript, Float64)',started:Date.now()};
  for(let mi=0;mi<job.models.length;mi++){
    const model=job.models[mi];const label=model.name;
    const rng=mulberry32(S.seed+mi*7919);
    const sp=makeSplits(model.n,S,rng);
    const R=rescale(model,S,sp.ana);
    const p=model.p;
    let units=S.units.slice(0,S.hiddenLayers),archSearch=null;
    if(S.autoUnits){archSearch=await autoArchitecture(model,R,sp,S,hooks,label,mi);units=archSearch.units;}
    const sizes=[p,...units,1];
    const cfg=trainCfg(S);
    const nets=[];const oof=new Float64Array(model.n).fill(NaN);
    const impSum=new Array(model.groups.length).fill(0);
    for(let k=0;k<sp.splits.length;k++){
      const {train,test}=sp.splits[k];
      const tr=subset(R.X,R.Y,p,train),te=subset(R.X,R.Y,p,test);
      const net=new Net(sizes,S.hAct,S.oAct);
      const res=trainNet(net,{Xtr:tr.X,Ytr:tr.Y,ntr:tr.n,Xte:te.X,Yte:te.Y,nte:te.n},cfg,mulberry32(S.seed+1009*(k+1)+mi*104729));
      const th=res.theta;
      const sseTr=net.sse(th,tr.X,tr.Y,tr.n),sseTe=te.n?net.sse(th,te.X,te.Y,te.n):0;
      const sstTr=sst(tr.Y,tr.n),sstTe=te.n?sst(te.Y,te.n):0;
      const predTe=net.predict(th,te.X,te.n);
      if(S.scheme==='kfold')test.forEach((r,i)=>{oof[r]=predTe[i];});
      let hold=null;
      if(sp.hold.length){const h=subset(R.X,R.Y,p,sp.hold);const s1=net.sse(th,h.X,h.Y,h.n);hold={n:h.n,sse:s1,rmse:Math.sqrt(s1/h.n),relErr:s1/(sst(h.Y,h.n)||1)};}
      // sensitivity analysis on the combined training + testing sample (as SPSS does)
      const comb=subset(R.X,R.Y,p,train.concat(test));
      const sens=sensitivity(net,th,comb.X,comb.Y,comb.n,p,model.groups,S.permRepeats,mulberry32(S.seed+k*13+mi*17+5));
      sens.importance.forEach((v,i)=>impSum[i]+=v);
      nets.push({
        k:k+1,nTrain:tr.n,nTest:te.n,
        sseTrain:sseTr,sseTest:sseTe,
        rmseTrain:Math.sqrt(sseTr/tr.n),rmseTest:te.n?Math.sqrt(sseTe/te.n):0,
        relErrTrain:sseTr/(sstTr||1),relErrTest:te.n?sseTe/(sstTe||1):0,
        r2Train:1-sseTr/(sstTr||1),r2Test:te.n?1-sseTe/(sstTe||1):0,
        hold,epochs:res.epochs,bestEpoch:res.bestEpoch,stopReason:res.stopReason,ms:res.ms,
        theta:Array.from(th),importance:sens.importance,normalized:sens.normalized,rawImportance:sens.raw,
        histTr:downsample(res.histTr,400),histTe:downsample(res.histTe,400),
        trainRows:train,testRows:test,predTest:Array.from(predTe),obsTest:Array.from(te.Y)
      });
      if(hooks.progress)hooks.progress({phase:'net',msg:`${label}: network ${k+1} of ${sp.splits.length} trained (${res.epochs} epochs, ${res.ms} ms)`,frac:(k+1)/sp.splits.length,model:mi});
      await hooks.tick();
    }
    const K=nets.length;
    const avgImp=impSum.map(v=>v/K);const mx=Math.max(...avgImp)||1;
    const sumRmseTe=nets.reduce((a,b)=>a+b.rmseTest,0),sumSseTe=nets.reduce((a,b)=>a+b.sseTest,0);
    const s2y=sumSseTe/K; // Leong et al. (2025): S²y = ΣSSE / 10
    const r2Leong=s2y>0?1-sumRmseTe/(K*s2y):null;
    // pooled out-of-sample (predictive) R² — k-fold: every case predicted exactly once
    let r2Pred=null;
    if(S.scheme==='kfold'){let se=0,m=0,c=0;for(const r of sp.ana){m+=R.Y[r];c++;}m/=c;let st=0;for(const r of sp.ana){se+=(R.Y[r]-oof[r])**2;st+=(R.Y[r]-m)**2;}r2Pred=1-se/(st||1);}
    else r2Pred=mean(nets.map(n=>n.r2Test));
    out.models.push({
      name:model.name,dep:model.dep,groups:model.groups.map(g=>g.name),cols:model.cols,featureNames:model.cols.map(c=>c.label),
      nTotal:model.n,nExcluded:model.nExcluded,nHoldout:sp.hold.length,holdRows:sp.hold,nAnalysis:sp.ana.length,
      sizes,units,archSearch,colInfo:R.colInfo,dv:R.dv,nets,
      summary:{
        meanRmseTrain:mean(nets.map(n=>n.rmseTrain)),sdRmseTrain:sd(nets.map(n=>n.rmseTrain)),
        meanRmseTest:mean(nets.map(n=>n.rmseTest)),sdRmseTest:sd(nets.map(n=>n.rmseTest)),
        meanSseTrain:mean(nets.map(n=>n.sseTrain)),meanSseTest:mean(nets.map(n=>n.sseTest)),
        meanR2Test:mean(nets.map(n=>n.r2Test)),sdR2Test:sd(nets.map(n=>n.r2Test)),
        s2y,r2Leong,r2Pred,
        avgImportance:avgImp,normImportance:avgImp.map(v=>v/mx*100),
        sdImportance:model.groups.map((_,i)=>sd(nets.map(n=>n.importance[i]))),
        oofPred:S.scheme==='kfold'?sp.ana.map(r=>oof[r]):null,oofObs:S.scheme==='kfold'?sp.ana.map(r=>R.Y[r]):null,
        totalMs:nets.reduce((a,b)=>a+b.ms,0)
      }
    });
  }
  out.finished=Date.now();
  return out;
}

const $=id=>document.getElementById(id);

// ───────────────────────── STATISTICS ─────────────────────────
function describe(vals){

  return{n,mean:m,sd:sdv,min:Math.min(...x),max:Math.max(...x),skew,kurt};

// Solve (A)x=b with Gaussian elimination (small systems)
function solve(A,b){const n=b.length;const M=A.map((r,i)=>[...r,b[i]]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const d=M[c][c];if(Math.abs(d)<1e-14)return null;for(let r=0;r<n;r++){if(r===c)continue;const k=M[r][c]/d;for(let j=c;j<=n;j++)M[r][j]-=k*M[c][j];}}return M.map((r,i)=>r[n]/r[i]);}
function invert(A){const n=A.length;const M=A.map((r,i)=>[...r,...Array.from({length:n},(_,j)=>i===j?1:0)]);for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(M[r][c])>Math.abs(M[p][c]))p=r;[M[c],M[p]]=[M[p],M[c]];const d=M[c][c];if(Math.abs(d)<1e-14)return null;for(let j=0;j<2*n;j++)M[c][j]/=d;for(let r=0;r<n;r++){if(r===c)continue;const k=M[r][c];for(let j=0;j<2*n;j++)M[r][j]-=k*M[c][j];}}return M.map(r=>r.slice(n));}
// OLS with intercept; X: array of rows. Returns {b, se, yhat, r2, sse, df}
function ols(X,y,ridge=1e-10){
  const n=X.length,p=X[0].length+1;const XtX=Array.from({length:p},()=>new Array(p).fill(0)),Xty=new Array(p).fill(0);
  for(let i=0;i<n;i++){const r=[1,...X[i]];for(let a=0;a<p;a++){Xty[a]+=r[a]*y[i];for(let b=0;b<p;b++)XtX[a][b]+=r[a]*r[b];}}
  for(let a=1;a<p;a++)XtX[a][a]+=ridge;
  const inv=invert(XtX);if(!inv)return null;
  const b=inv.map(row=>row.reduce((s,v,j)=>s+v*Xty[j],0));

  const df=n-p;const s2=sse/Math.max(1,df);
  return{b,se:inv.map((r,i)=>Math.sqrt(Math.max(0,r[i]*s2))),yhat,r2:1-sse/(sst||1),sse,df,n,p};
}
// Regularized incomplete beta → F and t distribution p-values
function lnGamma(z){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(z<0.5)return Math.log(Math.PI/Math.sin(Math.PI*z))-lnGamma(1-z);z-=1;let x=c[0];for(let i=1;i<g+2;i++)x+=c[i]/(z+i);const t=z+g+0.5;return 0.5*Math.log(2*Math.PI)+(z+0.5)*Math.log(t)-t+Math.log(x);}
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=300;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break;}return h;}
function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lnGamma(a+b)-lnGamma(a)-lnGamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b;}
const pF=(F,d1,d2)=>F<=0?1:ibeta(d2/(d2+d1*F),d2/2,d1/2);

// ───────────────────────── NAVIGATION ─────────────────────────
function goStep(n){if(n<0||n>9)return;APP.step=n;renderProgressBar();renderSidebar();renderStep();$('content').scrollTop=0;}

// ───────────────────────── DEMO DATA ─────────────────────────
function loadDemo(){
  const r=rng32(2025),n=320;const rows=[];
  for(let i=0;i<n;i++){
    const g=gauss(r);const L=()=>0.55*g+Math.sqrt(1-0.3025)*gauss(r);
    const PE=L(),EE=L(),SI=L(),FC=L(),HM=L();
    const BI=0.42*PE+0.08*EE+0.20*SI+0.12*FC+0.26*HM+0.18*Math.max(0,PE)*Math.max(0,HM)-0.10*Math.max(0,-SI)**2+0.55*gauss(r);
    const UB=0.45*BI+0.22*FC+0.25*Math.tanh(1.8*BI)*(FC>0?1:0.3)+0.6*gauss(r);
    rows.push({ID:i+1,Gender:r()<0.52?'Female':'Male',PE,EE,SI,FC,HM,BI,UB});
  }
  ['PE','EE','SI','FC','HM','BI','UB'].forEach(k=>{const v=rows.map(x=>x[k]);const m=meanA(v),s=sdA(v);rows.forEach(x=>x[k]=+((x[k]-m)/s).toFixed(3));});
  rows[17].EE='';rows[88].SI='';rows[203].BI='';// a few missing values → listwise deletion demo
  setData(rows,['ID','Gender','PE','EE','SI','FC','HM','BI','UB'],'demo_UTAUT_LV_scores.csv (built-in demo)');
  const plsFor=(dep,ins)=>{const ok=rows.filter(x=>[dep,...ins].every(k=>toNum(x[k])!==null));const res=ols(ok.map(x=>ins.map(k=>+x[k])),ok.map(x=>+x[dep]));const pls={};ins.forEach((k,i)=>{const t=res.b[i+1]/res.se[i+1];pls[k]={beta:+res.b[i+1].toFixed(3),sig:pT(Math.abs(t),res.df)<.05};});return{pls,r2:res.r2.toFixed(3)};};
  const a=plsFor('BI',['PE','EE','SI','FC','HM']),b=plsFor('UB',['BI','FC']);
  APP.models=[Object.assign(newModel('Model A'),{dependent:'BI',covariates:['PE','EE','SI','FC','HM'],pls:a.pls,plsR2:a.r2}),
              Object.assign(newModel('Model B'),{dependent:'UB',covariates:['BI','FC'],pls:b.pls,plsR2:b.r2})];
  APP.active=0;APP.results=null;
  toast('Demo data loaded: 320 respondents, UTAUT constructs, two ANN models');
  goStep(1);
}

function setupDropZone(){const dz=$('drop-zone');if(!dz)return;
  dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('dragover');});
  dz.addEventListener('dragleave',()=>dz.classList.remove('dragover'));
  dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('dragover');if(e.dataTransfer.files[0])handleFileUpload(e.dataTransfer.files[0]);});}
function handleFileUpload(file){
  if(!file)return;const ext=file.name.split('.').pop().toLowerCase();
  if(ext==='csv'||ext==='txt'){
    Papa.parse(file,{header:true,dynamicTyping:false,skipEmptyLines:'greedy',transformHeader:h=>h.trim(),
      complete:r=>{if(!r.data.length){toast('The file appears to be empty','err');return;}setData(r.data,r.meta.fields.filter(h=>h!==''),file.name);},
      error:e=>toast('Could not read CSV: '+e.message,'err')});
  }else if(ext==='xlsx'||ext==='xls'){
    const reader=new FileReader();
    reader.onload=e=>{try{const wb=XLSX.read(e.target.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];
      const json=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});if(!json.length){toast('The first sheet is empty','err');return;}
      const hdr=XLSX.utils.sheet_to_json(ws,{header:1})[0].map(h=>String(h).trim()).filter(Boolean);
      setData(json,hdr,file.name+(wb.SheetNames.length>1?` (sheet "${wb.SheetNames[0]}")`:''));}catch(err){toast('Could not read Excel file: '+err.message,'err');}};
    reader.readAsArrayBuffer(file);
  }else toast('Unsupported file type. Please use CSV or Excel.','err');
}
function setData(rows,headers,fileName){
  const types={},stats={};
  headers.forEach(h=>{const raw=rows.map(r=>r[h]);const nonEmpty=raw.filter(v=>v!==null&&v!==undefined&&String(v).trim()!=='');
    const nums=raw.map(toNum);const numCount=nums.filter(v=>v!==null).length;
    const uniq=new Set(nonEmpty.map(String)).size;
    types[h]=nonEmpty.length&&numCount/nonEmpty.length>=0.95?'scale':'nominal';
    stats[h]=types[h]==='scale'?Object.assign(describe(nums),{missing:rows.length-numCount,uniq}):{n:nonEmpty.length,missing:rows.length-nonEmpty.length,uniq};});
  APP.data={rows,headers,types,stats,fileName};
  // drop model assignments that no longer exist
  APP.models.forEach(m=>{if(!headers.includes(m.dependent))m.dependent=null;m.covariates=m.covariates.filter(v=>headers.includes(v));m.factors=m.factors.filter(v=>headers.includes(v));});
  APP.results=null;
  if(APP.step===1)showDataInfo();
}
function showDataInfo(){

  const flagged=scale.filter(h=>Math.abs(d.stats[h].skew)>2||Math.abs(d.stats[h].kurt)>7);
  $('file-info').innerHTML=`<div class="ok-box"><strong>✅ ${esc(d.fileName)}</strong> — ${d.rows.length} rows × ${d.headers.length} columns (${scale.length} numeric, ${d.headers.length-scale.length} categorical/text).</div>
   ${anyMissing?`<div class="tip-box"><strong>Missing values detected.</strong> Like SPSS, SaNaSoft-ANN applies <strong>listwise deletion</strong>: a case is excluded from a model only if one of <em>that model's</em> variables is missing. The number of excluded cases is shown in the Case Processing Summary.</div>`:''}`;
  $('data-screen').innerHTML=`
    <div class="section-title">🔎 Data screening (descriptive statistics)</div>

      ${d.headers.map(h=>{const s=d.stats[h];const sc=d.types[h]==='scale';const bad=sc&&(Math.abs(s.skew)>2||Math.abs(s.kurt)>7);
        return `<tr><td><strong>${esc(h)}</strong></td><td>${sc?'Scale':'Categorical ('+s.uniq+' levels)'}</td><td class="num">${s.n}</td><td class="num" style="${s.missing?'color:var(--error);font-weight:700':''}">${s.missing}</td>
        ${sc?`<td class="num">${f(s.mean)}</td><td class="num">${f(s.sd)}</td><td class="num">${f(s.min)}</td><td class="num">${f(s.max)}</td><td class="num" style="${bad?'color:var(--warning);font-weight:700':''}">${f(s.skew)}</td><td class="num" style="${bad?'color:var(--warning);font-weight:700':''}">${f(s.kurt)}</td>`:'<td colspan="6" class="small">—</td>'}</tr>`;}).join('')}
    </table></div>
    <div class="hint-box"><strong>How to read this:</strong> Leong et al. (2025) ask researchers to assess multivariate assumptions (normality, linearity, multicollinearity). ANN makes no distributional assumptions, so non-normal data are not a problem for the ANN itself — but you should report them. |Skewness| > 2 or |kurtosis| > 7 are flagged as substantial departures from normality${flagged.length?` (flagged: <strong>${flagged.map(esc).join(', ')}</strong>)`:''}. Linearity and multicollinearity are tested for each model after the run (Results → Descriptives & Assumptions).</div>

}

const curModel=()=>APP.models[APP.active];
function validCases(m){

}
function maxArrows(){const auto=Math.max(0,...APP.models.map(m=>m.covariates.length+m.factors.length));return toNum(APP.maxArrows)||auto;}

      <button class="model-tab add" onclick="addModel()">＋ Add model</button>
    </div>
    <div class="row-3">
      <div class="form-group"><label class="field-label">Model name</label><input type="text" value="${esc(m.name)}" onchange="curModel().name=this.value.trim()||'Model';renderStep(2)"></div>
      <div class="form-group"><label class="field-label">🎯 Output neuron (dependent construct)</label>
        <select onchange="setDV(this.value)"><option value="">— select —</option>${scaleVars.map(v=>`<option ${v===m.dependent?'selected':''}>${esc(v)}</option>`).join('')}</select>

      ${inputs.map(v=>{const use=m.covariates.includes(v)||m.factors.includes(v);const isScale=d.types[v]==='scale';const role=m.factors.includes(v)?'factor':'covariate';const pl=m.pls[v]||{};

    </table></div>
    ${nonSig.length?`<div class="warn-box"><strong>Non-significant predictor(s): ${nonSig.map(esc).join(', ')}.</strong> Leong et al. (2025) use only the <em>significant</em> PLS-SEM predictors as input neurons. Consider removing them from this model.</div>`:''}

function setDV(v){const m=curModel();m.dependent=v||null;m.covariates=m.covariates.filter(x=>x!==v);m.factors=m.factors.filter(x=>x!==v);APP.results=null;renderStep(2);}
function toggleInput(v,on){const m=curModel();m.covariates=m.covariates.filter(x=>x!==v);m.factors=m.factors.filter(x=>x!==v);
  if(on){if(APP.data.types[v]==='scale')m.covariates.push(v);else m.factors.push(v);if(!m.pls[v])m.pls[v]={beta:'',sig:true};}
  APP.results=null;renderStep(2);}
function setRole(v,role){const m=curModel();m.covariates=m.covariates.filter(x=>x!==v);m.factors=m.factors.filter(x=>x!==v);(role==='factor'?m.factors:m.covariates).push(v);APP.results=null;renderStep(2);}
function setPls(v,k,val){const m=curModel();m.pls[v]=m.pls[v]||{beta:'',sig:true};m.pls[v][k]=k==='beta'?(val===''?'':Number(val)):val;if(k==='sig')renderStep(2);}
function addModel(){const L='ABCDEFGHIJKLMNOPQRSTUVWXYZ';APP.models.push(newModel('Model '+(L[APP.models.length]||APP.models.length+1)));APP.active=APP.models.length-1;renderStep(2);}
function delModel(i){if(!confirm(`Delete ${APP.models[i].name}?`))return;APP.models.splice(i,1);APP.active=0;APP.results=null;renderStep(2);}
function validateStep2(){
  const bad=APP.models.filter(m=>!m.dependent||(m.covariates.length+m.factors.length)<1);
  if(bad.length){toast(`${bad[0].name}: choose an output and at least one input.`,'err');return;}
  const small=APP.models.filter(m=>validCases(m)<20);
  if(small.length){toast(`${small[0].name} has only ${validCases(small[0])} usable cases — at least 20 are needed.`,'err');return;}
  next();
}

// ───────────────────────── STEP 7 — REVIEW & RUN ─────────────────────────
function complianceChecks(){
  const s=APP.settings,C=[];
  const add=(label,status,current,msg)=>C.push({label,status,current,msg});
  const allIn=APP.models.flatMap(m=>m.covariates.concat(m.factors).map(v=>({m,v})));
  const withPls=allIn.filter(x=>x.m.pls[x.v]&&x.m.pls[x.v].beta!==''&&x.m.pls[x.v].beta!==undefined);
  const nonSig=allIn.filter(x=>x.m.pls[x.v]&&x.m.pls[x.v].sig===false);
  add('Inputs are significant PLS-SEM predictors',nonSig.length?'warn':'pass',nonSig.length?`${nonSig.length} non-significant input(s)`:(withPls.length?'All inputs marked significant':'All inputs marked significant (no β entered)'),nonSig.length?'Use only significant predictors as input neurons':'✓ As recommended');
  const arrows=maxArrows();const nMin=Math.min(...APP.models.map(validCases));
  add('Sample size ≥ 50 × maximum arrows',nMin>=50*arrows?'pass':'warn',`n = ${nMin} vs ${50*arrows} required`,nMin>=50*arrows?'✓ Requirement met':'Below the recommended minimum — report as a limitation');
  const tr=s.scheme==='kfold'?(1-1/s.networks)*100:s.training,te=s.scheme==='kfold'?100/s.networks:s.test;
  const ok9010=Math.round(tr)===90&&Math.round(te)===10&&!s.holdout;
  add('Partition 90% training / 10% testing',ok9010?'pass':'warn',`${tr.toFixed(0)}/${te.toFixed(0)}${s.holdout?' + '+s.holdout+'% holdout':''}`,ok9010?'✓ Follows guideline':'Guideline: 90/10');
  add('Ten-fold cross-validation (10 networks)',s.networks===10&&s.scheme==='kfold'?'pass':'warn',`${s.networks} network(s), ${s.scheme==='kfold'?'k-fold':'random splits'}`,s.networks===10&&s.scheme==='kfold'?'✓ Ten networks, averaged results':'Guideline: ten-fold cross-validation');
  add('Two hidden layers (deep learning)',s.hiddenLayers===2?'pass':'warn',`${s.hiddenLayers} hidden layer(s)`,s.hiddenLayers===2?'✓ Deep ANN':'Guideline: two hidden layers');
  add('Hidden neurons generated automatically',s.autoUnits?'pass':'warn',s.autoUnits?'Automatic':'Custom '+s.units.slice(0,s.hiddenLayers).join('–'),s.autoUnits?'✓ As recommended':'Guideline: automatic');
  add('Sigmoid activation (hidden layers)',s.hAct==='sigmoid'?'pass':'warn',s.hAct,s.hAct==='sigmoid'?'✓':'Guideline: sigmoid');
  add('Sigmoid activation (output layer)',s.oAct==='sigmoid'?'pass':'warn',s.oAct,s.oAct==='sigmoid'?'✓':'Guideline: sigmoid');
  add('FFBP training algorithm',s.algorithm==='ffbp'?'pass':'warn',{ffbp:'FFBP',scg:'SCG',adam:'Adam'}[s.algorithm],s.algorithm==='ffbp'?'✓':'Guideline: FFBP');
  add('RMSE reported (training & testing)',s.output.rmse?'pass':'fail',s.output.rmse?'On':'Off',s.output.rmse?'✓':'Enable in Step 6');
  add('Sensitivity analysis / normalized importance',s.output.sensitivity?'pass':'fail',s.output.sensitivity?'On':'Off',s.output.sensitivity?'✓ Averaged over all networks':'Enable in Step 6');
  add('Synaptic weights reported',s.output.weights?'pass':'warn',s.output.weights?'On':'Off',s.output.weights?'✓':'Enable in Step 6');
  return C;
}

// ───────────────────────── ENGINE BRIDGE (Web Worker with fallback) ─────────────────────────
const ENGINE_SRC=()=>$('engine-src').textContent;
function runEngine(job,onProgress){
  return new Promise((resolve,reject)=>{
    APP.rejectRun=reject;
    const mainThread=async()=>{
      APP.engineMode='main thread';
      try{const api=new Function(ENGINE_SRC()+'\nreturn {runJob};')();
        const res=await api.runJob(job,{progress:m=>{if(APP.cancel)throw new Error('__cancel__');onProgress(m);},tick:()=>new Promise(r=>setTimeout(r,0))});
        resolve(res);}catch(e){reject(e);}
    };
    let w;
    try{
      const glue=`\nself.onmessage=async e=>{try{const res=await runJob(e.data,{progress:m=>self.postMessage({type:'progress',m})});self.postMessage({type:'done',res});}catch(err){self.postMessage({type:'error',msg:String(err&&err.message||err)});}};self.postMessage({type:'ready'});`;
      w=new Worker(URL.createObjectURL(new Blob([ENGINE_SRC()+glue],{type:'text/javascript'})));
    }catch(e){mainThread();return;}
    APP.worker=w;let ready=false;
    const to=setTimeout(()=>{if(!ready){w.terminate();APP.worker=null;mainThread();}},2500);
    w.onmessage=e=>{const d=e.data;
      if(d.type==='ready'){ready=true;APP.engineMode='background worker';clearTimeout(to);w.postMessage(job);}
      else if(d.type==='progress')onProgress(d.m);
      else if(d.type==='done'){w.terminate();APP.worker=null;resolve(d.res);}
      else if(d.type==='error'){w.terminate();APP.worker=null;reject(new Error(d.msg));}};
    w.onerror=e=>{e.preventDefault&&e.preventDefault();if(!ready){clearTimeout(to);w.terminate();APP.worker=null;mainThread();}else{w.terminate();APP.worker=null;reject(new Error(e.message||'Worker error'));}};
  });
}
function cancelRun(){APP.cancel=true;if(APP.worker){APP.worker.terminate();APP.worker=null;if(APP.rejectRun)APP.rejectRun(new Error('__cancel__'));}}
function setProg(frac,msg,sub){$('run-fill').style.width=(Math.max(0,Math.min(1,frac))*100).toFixed(1)+'%';if(msg!==undefined)$('run-progress-text').textContent=msg;if(sub!==undefined)$('run-sub').textContent=sub;}

// ───────────────────────── JOB PREPARATION ─────────────────────────
function buildJob(){
  const models=APP.models.map(m=>{
    const covs=m.covariates,facs=m.factors,kept=[];let excl=0;
    APP.data.rows.forEach(r=>{
      const y=toNum(r[m.dependent]);if(y===null){excl++;return;}
      const xs=covs.map(v=>toNum(r[v]));if(xs.some(v=>v===null)){excl++;return;}
      if(facs.some(v=>r[v]===null||r[v]===undefined||String(r[v]).trim()==='')){excl++;return;}
      kept.push({y,xs,fs:facs.map(v=>String(r[v]).trim())});
    });
    const levels=facs.map((v,i)=>[...new Set(kept.map(k=>k.fs[i]))].sort());
    const cols=[],groups=[];
    covs.forEach(v=>{cols.push({kind:'cov',label:v,group:groups.length});groups.push({name:v,cols:[cols.length-1]});});
    facs.forEach((v,i)=>{const gi=groups.length,cc=[];levels[i].forEach(l=>{cols.push({kind:'dummy',label:`${v}=${l}`,group:gi});cc.push(cols.length-1);});groups.push({name:v,cols:cc});});
    const p=cols.length,n=kept.length,X=new Array(n*p),Y=new Array(n);
    kept.forEach((k,r)=>{Y[r]=k.y;let c=0;k.xs.forEach(v=>X[r*p+c++]=v);facs.forEach((v,i)=>levels[i].forEach(l=>X[r*p+c++]=(k.fs[i]===l?1:0)));});
    return {name:m.name,dep:m.dependent,n,p,X,Y,nExcluded:excl,cols,groups,levels};
  });
  return {models,settings:JSON.parse(JSON.stringify(APP.settings))};
}

async function runAnalysis(){
  const job=buildJob();APP.cancel=false;
  const bad=job.models.find(m=>m.n<20);if(bad){toast(`${bad.name}: only ${bad.n} usable cases.`,'err');return;}
  $('run-overlay').classList.add('show');setProg(0,'Starting the neural engine…','');
  const nM=job.models.length,auto=job.settings.autoUnits,t0=performance.now();
  try{
    const res=await runEngine(job,m=>{
      const mi=m.model||0;const pf=auto?(m.phase==='arch'?0.4*m.frac:0.4+0.6*m.frac):m.frac;
      setProg((mi+pf)/nM,m.phase==='arch'?`Automatic neuron search — ${job.models[mi].name}`:`Training networks — ${job.models[mi].name}`,m.msg);
    });
    setProg(1,'Computing benchmark and assumption tests…','');await new Promise(r=>setTimeout(r,20));
    res.ms=performance.now()-t0;res.settings=job.settings;res.dataName=APP.data.fileName;res.date=new Date().toISOString();
    res.models.forEach((rm,i)=>{rm.spec=JSON.parse(JSON.stringify(APP.models[i]));rm.extra=postAnalyses(job.models[i],rm);});
    APP.results=res;APP.resModel=0;APP.resNet=0;APP.resTab='Summary';
    $('run-overlay').classList.remove('show');goStep(8);
    toast(`Analysis finished in ${(res.ms/1000).toFixed(1)} s`);
  }catch(e){
    $('run-overlay').classList.remove('show');
    if(e.message==='__cancel__'||APP.cancel)toast('Analysis cancelled');else{console.error(e);alert('Analysis error: '+e.message);}
  }
}

// Main-thread post-analyses: descriptives, correlations, VIF, RESET test, linear benchmark on identical splits
function postAnalyses(jm,rm){
  const {n,p,X,Y,cols,groups}=jm;
  const covIdx=cols.map((c,i)=>c.kind==='cov'?i:-1).filter(i=>i>=0);
  const col=i=>Array.from({length:n},(_,r)=>X[r*p+i]);
  const vars=[{name:jm.dep,v:Y.slice()}].concat(covIdx.map(i=>({name:cols[i].label,v:col(i)})));
  const desc=vars.map(x=>Object.assign({name:x.name},describe(x.v)));
  const corr=vars.map(a=>vars.map(b=>{const ma=meanA(a.v),mb=meanA(b.v);let sab=0,sa=0,sb=0;for(let i=0;i<n;i++){const da=a.v[i]-ma,db=b.v[i]-mb;sab+=da*db;sa+=da*da;sb+=db*db;}return sab/Math.sqrt(sa*sb||1);}));
  let vif=null;
  if(covIdx.length>=2){const Rm=corr.slice(1).map(r=>r.slice(1));const inv=invert(Rm);if(inv)vif=covIdx.map((ci,k)=>({name:cols[ci].label,vif:inv[k][k]}));}
  // design matrix: covariates + dummies minus the first level of each factor
  const keep=[];groups.forEach(g=>{g.cols.forEach((c,j)=>{if(cols[c].kind==='cov'||j>0)keep.push(c);});});
  const design=rows=>rows.map(r=>keep.map(c=>X[r*p+c]));
  const allRows=Array.from({length:n},(_,i)=>i);
  const lin=ols(design(allRows),Y);
  let reset=null;
  if(lin){const yh=lin.yhat,m=meanA(yh),s=sdA(yh)||1;const z=yh.map(v=>(v-m)/s);
    const aug=ols(design(allRows).map((r,i)=>[...r,z[i]**2,z[i]**3]),Y);
    if(aug){const q=2,df2=n-(keep.length+1)-q;const F=((lin.sse-aug.sse)/q)/(aug.sse/df2);reset={F,df1:q,df2,p:pF(F,q,df2),r2Lin:lin.r2,r2Aug:aug.r2};}}
  // linear benchmark on exactly the same training/testing splits, in the ANN's rescaled DV units
  const a=rm.dv.a,b=rm.dv.b;const ys=Y.map(v=>(v-a)/b);
  const bench=rm.nets.map(net=>{const tr=net.trainRows,te=net.testRows;const fit=ols(design(tr),tr.map(r=>ys[r]));if(!fit||!te.length)return null;
    const Xte=design(te);let sse=0;const pred=Xte.map(row=>fit.b[0]+row.reduce((s,v,j)=>s+v*fit.b[j+1],0));te.forEach((r,i)=>sse+=(ys[r]-pred[i])**2);
    let sst=0;const mt=meanA(te.map(r=>ys[r]));te.forEach(r=>sst+=(ys[r]-mt)**2);return{rmse:Math.sqrt(sse/te.length),r2:1-sse/(sst||1),pred,te};});
  let linPredR2=null;
  if(rm.summary.oofPred&&bench.every(Boolean)){const oof={};bench.forEach(bm=>bm.te.forEach((r,i)=>oof[r]=bm.pred[i]));const rowsA=Object.keys(oof).map(Number);const m=meanA(rowsA.map(r=>ys[r]));let se=0,st=0;rowsA.forEach(r=>{se+=(ys[r]-oof[r])**2;st+=(ys[r]-m)**2;});linPredR2=1-se/(st||1);}
  else if(bench.every(Boolean))linPredR2=meanA(bench.map(x=>x.r2));
  return{desc,corr,corrNames:vars.map(v=>v.name),vif,reset,linR2:lin?lin.r2:null,linCoef:lin?keep.map((c,j)=>({name:cols[c].label,b:lin.b[j+1],se:lin.se[j+1]})):null,
    bench:bench.map(x=>x?{rmse:x.rmse,r2:x.r2}:null),linPredR2,linMeanRmse:meanA(bench.filter(Boolean).map(x=>x.rmse))};
}

const IMP_NAMES=rm=>rm.groups;
function interpretation(rm){
  const s=rm.summary,ord=rankOrder(s.normImportance),g=rm.groups;
  const ratio=s.meanRmseTest/(s.meanRmseTrain||1);
  const ex=rm.extra;const gain=(ex&&ex.linPredR2!==null&&s.r2Pred!==null)?s.r2Pred-ex.linPredR2:null;
  let t=`<p>Across the ${rm.nets.length} networks, the mean RMSE was <strong>${f(s.meanRmseTrain,4)}</strong> (SD = ${f(s.sdRmseTrain,4)}) for training and <strong>${f(s.meanRmseTest,4)}</strong> (SD = ${f(s.sdRmseTest,4)}) for testing. `;
  t+=ratio<1.25?`The small and similar training and testing errors indicate that the model fits the data well and is not over-fitted.</p>`:`The testing error is noticeably larger than the training error (ratio ${f(ratio,2)}), which suggests some over-fitting; consider fewer hidden neurons or a small L2 weight decay.</p>`;
  t+=`<p>The out-of-sample predictive R² is <strong>${f(s.r2Pred,3)}</strong>${rm.spec.plsR2?` (PLS-SEM R² = ${esc(rm.spec.plsR2)})`:''}.`+(s.r2Leong!==null?` Using the formula of Leong et al. (2025), R² = <strong>${f(s.r2Leong,3)}</strong>.`:'')+`</p>`;
  t+=`<p>In the sensitivity analysis, <strong>${esc(g[ord[0]])}</strong> is the most important predictor of ${esc(rm.dep)} (normalized importance 100%)`+(ord.length>1?`, followed by ${ord.slice(1).map(i=>`${esc(g[i])} (${f(s.normImportance[i],1)}%)`).join(', ')}.`:'.')+`</p>`;
  if(gain!==null)t+=`<p>${gain>0.02?`The ANN predicts ${esc(rm.dep)} better than a linear regression on the same splits (predictive R² ${f(s.r2Pred,3)} vs ${f(ex.linPredR2,3)}), supporting the presence of non-linear or non-compensatory relationships.`:`The ANN and a linear regression on the same splits predict ${esc(rm.dep)} similarly (predictive R² ${f(s.r2Pred,3)} vs ${f(ex.linPredR2,3)}); the relationships appear largely linear, so the ANN mainly serves to confirm the predictor ranking.`}</p>`;
  return t;
}
function rankOrder(v){return v.map((x,i)=>i).sort((a,b)=>v[b]-v[a]);}

  case 'Model Summary':{const ms=x=>{const d=new Date(x);return d.toISOString().substr(11,12);};return `

    <div class="hint-box"><strong>Relative error</strong> = SSE ÷ total sum of squares of the dependent variable in that sample — the share of variance <em>not</em> explained (so 1 − relative error is the R² of that sample). This is how SPSS defines it.</div>`;}

    <div class="hint-box">Blue lines = positive synaptic weights, grey = negative; thicker = larger |weight| (SPSS convention). Figure 22 in Leong et al. (2025) shows the same kind of diagram.</div>`;

  case 'Architecture Search':{const a=rm.archSearch;const sorted=a.grid.slice().sort((x,y)=>x.testMSE-y.testMSE);return `

function rmseTable(rm){const s=rm.summary;return `
  <div style="overflow-x:auto"><table class="spss"><caption>RMSE values of the ${rm.nets.length} networks — ${esc(rm.name)} (output: ${esc(rm.dep)})</caption>
    <tr><th rowspan="2">Network</th><th colspan="3" style="text-align:center">Training</th><th colspan="3" style="text-align:center">Testing</th></tr>
    <tr><th class="num">N</th><th class="num">SSE</th><th class="num">RMSE</th><th class="num">N</th><th class="num">SSE</th><th class="num">RMSE</th></tr>

    <tr class="mean"><td>Mean</td><td></td><td class="num">${f(s.meanSseTrain,3)}</td><td class="num">${f(s.meanRmseTrain,4)}</td><td></td><td class="num">${f(s.meanSseTest,3)}</td><td class="num">${f(s.meanRmseTest,4)}</td></tr>
    <tr><td>SD</td><td></td><td></td><td class="num">${f(s.sdRmseTrain,4)}</td><td></td><td></td><td class="num">${f(s.sdRmseTest,4)}</td></tr>

function sensTable(rm){const s=rm.summary,g=rm.groups,ord=rankOrder(s.normImportance);const rank=g.map((_,i)=>ord.indexOf(i)+1);return `
  <div style="overflow-x:auto"><table class="spss"><caption>Sensitivity analysis — ${esc(rm.name)} (output: ${esc(rm.dep)})</caption>
    <tr><th>Network</th>${g.map(x=>`<th class="num">${esc(x)}</th>`).join('')}</tr>
    ${rm.nets.map(n=>`<tr><td>ANN${n.k}</td>${n.importance.map(v=>`<td class="num">${f0(v,3)}</td>`).join('')}</tr>`).join('')}

function compRows(rm){

  const aOrd=rankOrder(s.normImportance);
  return g.map((x,i)=>({name:x,beta:beta[i],sig:pl[x]?pl[x].sig!==false:true,pRank:beta[i]===null?null:pOrd.indexOf(i)+1,imp:s.normImportance[i],aRank:aOrd.indexOf(i)+1}))
    .map(r=>Object.assign(r,{match:r.pRank===null?null:r.pRank===r.aRank})).sort((a,b)=>a.aRank-b.aRank);

function compTable(rm){const rows=compRows(rm);const nm=rows.filter(r=>r.match===false).length;return `

    ${rows.map(r=>`<tr><td>${esc(r.name)}${r.sig?'':' <span class="small">(n.s.)</span>'}</td><td class="num">${r.beta===null?'–':f0(r.beta,3)}</td><td class="num">${r.pRank??'–'}</td><td class="num">${f(r.imp,1)}</td><td class="num">${r.aRank}</td><td>${r.match===null?'–':r.match?'<span class="pill-ok">Matched</span>':'<span class="pill-no">Not matched</span>'}</td></tr>`).join('')}
  </table>

function benchTable(rm){const ex=rm.extra;if(!ex||!ex.bench)return '<p>Not available.</p>';return `

    <tr><th>Network</th><th class="num">ANN RMSE</th><th class="num">Linear RMSE</th></tr>
    ${rm.nets.map((n,i)=>`<tr><td>ANN${n.k}</td><td class="num">${f(n.rmseTest,4)}</td><td class="num">${ex.bench[i]?f(ex.bench[i].rmse,4):'–'}</td></tr>`).join('')}

function assumptionsHTML(rm){const ex=rm.extra;if(!ex)return '';const nm=ex.corrNames;return `
  <div class="section-title">Descriptive statistics (analysis sample, n = ${rm.nTotal})</div>
  <div style="overflow-x:auto"><table class="spss"><tr><th>Variable</th><th class="num">Mean</th><th class="num">SD</th><th class="num">Min</th><th class="num">Max</th><th class="num">Skewness</th><th class="num">Kurtosis</th></tr>
  ${ex.desc.map(d=>`<tr><td>${esc(d.name)}</td><td class="num">${f(d.mean)}</td><td class="num">${f(d.sd)}</td><td class="num">${f(d.min)}</td><td class="num">${f(d.max)}</td><td class="num">${f(d.skew)}</td><td class="num">${f(d.kurt)}</td></tr>`).join('')}</table></div>
  <div class="section-title">Correlation matrix</div>

  ${ex.vif?`<div class="section-title">Multicollinearity (VIF)</div><table class="spss"><tr><th>Predictor</th><th class="num">VIF</th></tr>${ex.vif.map(v=>`<tr><td>${esc(v.name)}</td><td class="num" style="${v.vif>=3?'color:var(--error);font-weight:700':''}">${f(v.vif,3)}</td></tr>`).join('')}</table><div class="small">VIF &lt; 3 indicates no multicollinearity concern (Hair et al., 2019).</div>`:''}

function paramTable(rm,net){
  const sz=rm.sizes,L=sz.length-1,th=net.theta;const off=[];let o=0;for(let l=0;l<L;l++){off.push(o);o+=(sz[l]+1)*sz[l+1];}

  const colHdr=[];for(let l=1;l<=L;l++)for(let j=0;j<sz[l];j++)colHdr.push({l,j});

  for(let l=1;l<=L;l++)h+=`<th colspan="${sz[l]}" style="text-align:center">${l===L?'Output Layer':'Hidden Layer '+l}</th>`;
  h+=`</tr><tr>${colHdr.map(c=>`<th class="num">${esc(unitName(c.l,c.j))}</th>`).join('')}</tr>`;

      colHdr.forEach(c=>{h+=c.l===l+1?`<td class="num">${f(th[off[l]+c.j*(nIn+1)+r.i],3)}</td>`:'<td></td>';});h+='</tr>';});
  }
  return h+`</table></div><div class="small" style="margin-top:6px">Synaptic weights connecting each unit (rows) to the units of the next layer (columns). Inputs were rescaled (${esc(APP.results.settings.covRescale)}) before training.</div>`;
}
function diagramSVG(rm,net){
  const sz=rm.sizes,L=sz.length-1,th=net.theta,S=APP.results.settings;const off=[];let o=0;for(let l=0;l<L;l++){off.push(o);o+=(sz[l]+1)*sz[l+1];}

  for(let l=0;l<L;l++)nodes+=`<circle cx="${X(l)+34}" cy="${BY}" r="13" fill="#fff" stroke="#555" stroke-width="1.2"/><text x="${X(l)+34}" y="${BY+4}" font-size="9" text-anchor="middle" fill="#333">Bias</text>`;
  for(let l=0;l<=L;l++)for(let j=0;j<sz[l];j++){const cx=X(l),cy=Y(l,j);const fill=l===0?'#ff8f00':l===L?'#2e7d32':'#3949ab';

    <g transform="translate(${W-230},14)"><line x1="0" y1="6" x2="26" y2="6" stroke="#1e5bb8" stroke-width="3"/><text x="32" y="10" font-size="10.5" fill="#333">Synaptic weight &gt; 0</text><line x1="0" y1="22" x2="26" y2="22" stroke="#9e9e9e" stroke-width="3"/><text x="32" y="26" font-size="10.5" fill="#333">Synaptic weight &lt; 0</text></g>
    <text x="10" y="${H+8}" font-size="10.5" fill="#555">Hidden layer activation: ${act[S.hAct]} · Output layer activation: ${act[S.oAct]} · Network ${net.k}</text></svg>`;

function downloadDiagram(kind){

function drawTabCharts(tab,rm){

      options:{maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{title:{display:true,text:`Network ${net.k} — best epoch ${net.bestEpoch}`}},scales:{x:{title:{display:true,text:'Epoch'},ticks:{maxTicksLimit:12}},y:{type:'logarithmic',title:{display:true,text:'MSE (log scale)'}}}},
      plugins:[{id:'best',afterDraw(ch){const xs=ch.scales.x;const idx=lab.findIndex(v=>v>=net.bestEpoch);if(idx<0)return;const x=xs.getPixelForValue(idx);const c=ch.ctx;c.save();c.setLineDash([5,4]);c.strokeStyle='#2e7d32';c.beginPath();c.moveTo(x,ch.chartArea.top);c.lineTo(x,ch.chartArea.bottom);c.stroke();c.restore();}}]});}

      options:{maintainAspectRatio:false,plugins:{title:{display:true,text:'Predicted vs observed'}},scales:{x:{title:{display:true,text:'Observed '+rm.dep}},y:{title:{display:true,text:'Predicted '+rm.dep}}}}});

      options:{maintainAspectRatio:false,plugins:{legend:{display:false},title:{display:true,text:'Residuals vs predicted'}},scales:{x:{title:{display:true,text:'Predicted'}},y:{title:{display:true,text:'Residual (observed − predicted)'}}}}});}

function exportCSV(){
  const R=APP.results,q=v=>{const s=String(v??'');return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};const L=[];const row=(...a)=>L.push(a.map(q).join(','));

let CITED=[];
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const todayParts=()=>{const d=new Date();return{d:d.getDate(),m:MONTHS[d.getMonth()],mon:MONTHS[d.getMonth()].slice(0,3),y:d.getFullYear()};};
const noSp=i=>i.replace(/\s+/g,'');
const tc=t=>t.replace(/(^|[\s:–-]+)([a-z])/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(A|An|The|And|Or|Of|In|On|For|To|By|With)\b(?!:)/g,(w,x,o)=>o===0?w:w.toLowerCase()).replace(/^./,c=>c.toUpperCase());
const lowerAfterColon=t=>t.replace(/:\s+([A-Z])/g,(m,c)=>': '+c.toLowerCase());
function joinA(list,sep,last){return list.length<2?list.join(''):list.slice(0,-1).join(sep)+last+list[list.length-1];}
function authorsFor(r,st){const A=r.a;
  if(st==='apa7'||st==='apa6')return joinA(A.map(([f,i])=>`${f}, ${i}`),', ',A.length===2?', &amp; ':', &amp; ');
  if(st==='harvard'||st==='emerald')return joinA(A.map(([f,i])=>`${f}, ${noSp(i)}`),', ',' and ');
  if(st==='chicago')return joinA(A.map(([f,i],k)=>k===0?`${f}, ${i}`:`${i} ${f}`),', ',A.length===2?', and ':', and ');
  if(st==='ieee')return joinA(A.map(([f,i])=>`${i} ${f}`),', ',A.length===2?' and ':', and ');
  return A.map(([f,i])=>`${f} ${i.replace(/[.\-\s]/g,'')}`).join(', ');}
function cite(key,narr){
  const st=APP.settings.report.style,r=REFS[key];if(!CITED.includes(key))CITED.push(key);const n=CITED.indexOf(key)+1;
  const a=r.a.map(x=>x[0]);const names=a.length===1?a[0]:a.length===2?a[0]+((st==='apa7'||st==='apa6')&&!narr?' &amp; ':' and ')+a[1]:a[0]+' et al.';
  if(st==='ieee')return narr?`${names} [${n}]`:`[${n}]`;
  if(st==='vancouver')return narr?`${names} (${n})`:`(${n})`;
  if(narr)return `${names} (${r.y})`;
  return st==='chicago'?`(${names} ${r.y})`:`(${names}, ${r.y})`;
}
function fmtRef(key){
  const st=APP.settings.report.style,r=REFS[key],A=authorsFor(r,st),Y=r.y,t=todayParts(),v=VERSION,url=SOFTWARE_URL,I=x=>`<i>${x}</i>`;
  const noDot=A.replace(/\.$/,'');
  if(st==='apa7'||st==='apa6'){const doi=st==='apa7'?`https://doi.org/${r.doi}`:`doi:${r.doi}`;
    if(r.type==='article')return `${A} (${Y}). ${r.t}. ${I(r.j+', '+r.v)}(${r.i}), ${r.p}. ${doi}`;
    if(r.type==='conf')return `${A} (${Y}). ${I(r.t)}. Paper presented at the ${r.conf}. ${st==='apa6'?'Retrieved from ':''}${r.url}`;
    return `${A} (${Y}). ${I(r.t)} (Version ${v}) [Computer software]. ${st==='apa6'?'Retrieved from ':''}${url}`;}
  if(st==='harvard'){
    if(r.type==='article')return `${A} (${Y}) ‘${r.t}’, ${I(r.j)}, ${r.v}(${r.i}), pp. ${r.p}. Available at: https://doi.org/${r.doi}.`;
    if(r.type==='conf')return `${A} (${Y}) ‘${r.t}’, ${I(r.conf)}. Available at: ${r.url}.`;
    return `${A} (${Y}) ${I(r.t)} (Version ${v}) [Computer program]. Available at: ${url} (Accessed: ${t.d} ${t.m} ${t.y}).`;}
  if(st==='emerald'){
    if(r.type==='article')return `${A} (${Y}), “${r.t}”, ${I(r.j)}, Vol. ${r.v} No. ${r.i}, pp. ${r.p.replace('–','-')}, doi: ${r.doi}.`;
    if(r.type==='conf')return `${A} (${Y}), “${r.t}”, ${I(r.conf)}, available at: ${r.url}.`;
    return `${A} (${Y}), “${r.t}”, Version ${v}, available at: ${url} (accessed ${t.d} ${t.m} ${t.y}).`;}
  if(st==='chicago'){
    if(r.type==='article')return `${noDot}. ${Y}. “${tc(r.t)}.” ${I(r.j)} ${r.v} (${r.i}): ${r.p}. https://doi.org/${r.doi}.`;
    if(r.type==='conf')return `${noDot}. ${Y}. “${tc(r.t)}.” Paper presented at the ${r.conf}. ${r.url}.`;
    return `${noDot}. ${Y}. ${I(tc(r.t))}. Version ${v}. ${url}.`;}
  if(st==='ieee'){
    if(r.type==='article')return `${A}, “${r.t},” ${I(r.j)}, vol. ${r.v}, no. ${r.i}, pp. ${r.p}, ${Y}, doi: ${r.doi}.`;
    if(r.type==='conf')return `${A}, “${r.t},” in ${I('Proc. '+r.conf)}, ${Y}. [Online]. Available: ${r.url}`;
    return `${A}, ${I(tc(r.t))}, version ${v}. (${Y}). [Online]. Available: ${url}`;}
  if(r.type==='article')return `${A}. ${lowerAfterColon(r.t)}. ${r.j}. ${Y};${r.v}(${r.i}):${r.p.replace('–','-')}. doi:${r.doi}`;
  if(r.type==='conf')return `${A}. ${lowerAfterColon(r.t)}. In: ${r.conf}; ${Y}. Available from: ${r.url}`;
  return `${A}. ${lowerAfterColon(r.t)} [Internet]. Version ${v}. ${Y} [cited ${t.y} ${t.mon} ${t.d}]. Available from: ${url}`;
}

function downloadHTML(){download('SaNaSoft-ANN_report.html',`<!DOCTYPE html><html><head><meta charset="utf-8"><title>ANN Report</title><style>${DOC_CSS}body{max-width:820px;margin:40px auto}</style></head><body>${buildReportHTML(false)}</body></html>`,'text/html');}
async function copyReport(){const html=buildReportHTML(true);const tmp=document.createElement('div');tmp.innerHTML=html;
  try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([`<style>${DOC_CSS}</style>`+html],{type:'text/html'}),'text/plain':new Blob([tmp.innerText],{type:'text/plain'})})]);toast('Report copied — paste into Word to keep the formatting');}
  catch(e){const el=$('report-output');const r=document.createRange();r.selectNodeContents(el);const sel=getSelection();sel.removeAllRanges();sel.addRange(r);document.execCommand('copy');sel.removeAllRanges();toast('Report copied');}}

// ───────────────────────── PROJECT SAVE / LOAD ─────────────────────────
function saveProject(){
  if(!APP.data){toast('Nothing to save yet — import data first.','err');return;}
  const proj={app:'SaNaSoft-ANN',version:VERSION,saved:new Date().toISOString(),data:{rows:APP.data.rows,headers:APP.data.headers,fileName:APP.data.fileName},models:APP.models,settings:APP.settings,maxArrows:APP.maxArrows};
  download((APP.data.fileName.replace(/\.[^.]+$/,'').replace(/[^\w-]+/g,'_')||'project')+'.sanaann.json',JSON.stringify(proj),'application/json');
  toast('Project saved (data, models and settings). Re-running with the same seed reproduces the results exactly.');
}
function loadProject(file){
  if(!file)return;const rd=new FileReader();
  rd.onload=()=>{try{const p=JSON.parse(rd.result);if(p.app!=='SaNaSoft-ANN')throw new Error('Not a SaNaSoft-ANN project file');
    setData(p.data.rows,p.data.headers,p.data.fileName);APP.models=p.models;APP.active=0;APP.maxArrows=p.maxArrows||'';
    const d=DEFAULT_SETTINGS();APP.settings=Object.assign(d,p.settings,{output:Object.assign(d.output,p.settings.output||{}),report:Object.assign(d.report,p.settings.report||{})});
    APP.results=null;toast('Project loaded');goStep(7);}catch(e){toast('Could not open project: '+e.message,'err');}};
  rd.readAsText(file);
}

let tutStep = 0;

function openTutorial(){
  tutStep = 0;
  renderTutorial();
  document.getElementById('tutorial-overlay').classList.add('show');
}

function closeTutorial(){
  document.getElementById('tutorial-overlay').classList.remove('show');
}

function tutNav(dir){
  tutStep = Math.max(0, Math.min(TUT_STEPS.length-1, tutStep+dir));
  renderTutorial();
}

function tutGoto(i){
  tutStep = i;
  renderTutorial();
}

function renderTutorial(){
  const s = TUT_STEPS[tutStep];
  const n = TUT_STEPS.length;

  // Nav tabs
  document.getElementById('tut-nav').innerHTML = TUT_STEPS.map((t,i)=>
    `<button class="tut-tab ${i===tutStep?'active':''}" onclick="tutGoto(${i})">${t.label}</button>`
  ).join('');

  // Counter
  document.getElementById('tut-counter').textContent = `Step ${tutStep+1} of ${n}`;

  // Prev/Next buttons
  const prev = document.getElementById('tut-prev');
  const next = document.getElementById('tut-next');
  prev.disabled = tutStep===0;
  prev.style.opacity = tutStep===0?'0.4':'1';
  if(tutStep===n-1){
    next.textContent = '✓ Close';
    next.onclick = closeTutorial;
  } else {
    next.textContent = 'Next →';
    next.onclick = ()=>tutNav(1);
  }

  // Build SPSS mockup tabs
  const tabsHtml = s.spssTabsHtml
    ? `<div class="spss-tabs">${s.spssTabsHtml}</div>`
    : '';

  // Body
  document.getElementById('tut-body').innerHTML = `
    <div class="tut-step-title">${s.title}</div>
    <div class="tut-step-sub">${s.sub}</div>

    <div class="tut-compare">
      <div class="tut-panel spss">
        <div class="tut-panel-header">🖥️ SPSS Statistics (IBM)</div>
        <div class="tut-panel-body" style="padding:8px">
          <div class="spss-mockup">
            <div class="spss-titlebar">
              <span>📊</span> ${s.spssTitle}
            </div>
            <div class="spss-menu">
              <span>File</span><span>Edit</span><span>View</span><span>Data</span>
              <span>Transform</span><span>Analyze</span><span>Graphs</span><span>Utilities</span><span>Help</span>
            </div>
            ${tabsHtml}
            <div class="spss-content">
              ${s.spssContentHtml}
            </div>
          </div>
          <div class="figure-label">Recreated from Leong et al. (2025, Journal of Computer Information Systems)</div>
        </div>
      </div>

      <div class="tut-panel sana">
        <div class="tut-panel-header">✨ SaNaSoft-ANN (This App)</div>
        <div class="tut-panel-body">
          ${s.sanaHtml}
        </div>
      </div>
    </div>

    ${s.keyPoint ? `<div class="tut-key-points"><strong>📌 Key Guideline (Leong et al., 2025):</strong> ${s.keyPoint}</div>` : ''}
    ${s.warning  ? `<div class="tut-warning"><strong>⚠️ Important:</strong> ${s.warning}</div>` : ''}

    <div style="margin-top:14px;padding:10px 14px;background:#f0f2f8;border-radius:8px;font-size:11px;color:#6b7280">
      <strong>Reference:</strong> Leong, L.-Y., Hew, T.-S., Ooi, K.-B., Tan, G. W.-H., &amp; Koohang, A. (2025). An SEM-ANN approach – Guidelines in information systems research. <em>Journal of Computer Information Systems, 65</em>(6), 706–737. https://doi.org/10.1080/08874417.2024.2329128
    </div>
  `;
}

// Close tutorial on overlay click (outside modal)
document.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('tutorial-overlay').addEventListener('click', function(e){
    if(e.target === this) closeTutorial();
  });
});

</script>
