<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>SaNaSoft: guided fsQCA for PLS-SEM latent variable scores (developed by Prof. S. Sabraz Nawaz and Prof. Ghazanfar Ali)</title>

<style>
:root{
  --bg:#F5F4EF; --surface:#FFFFFF; --sunk:#F0EEE6; --ink:#141413; --muted:#6B6A63; --line:#E5E2D8;
  --in:#B8552F; --in-soft:#F7E7DF; --out:#46679A; --out-soft:#E3EAF4;
  --warn:#8A5A00; --warn-soft:#F7EBD3; --ok:#1F6B45; --ok-soft:#DDEFE4;
  --green:#006C35; --green-deep:#00552A; --on-green:#FFFFFF;
  --serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --sans:'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#262624; --surface:#30302E; --sunk:#1F1F1D; --ink:#F2F1EC; --muted:#A8A69D; --line:#44433F;
    --in:#E08A67; --in-soft:#4A3128; --out:#9DB6E0; --out-soft:#2B3445;
    --warn:#E6B865; --warn-soft:#3A2F1B; --ok:#7FD0A2; --ok-soft:#1E3A2B; --green:#0B5E34; --green-deep:#084A29; --on-green:#FFFFFF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#262624; --surface:#30302E; --sunk:#1F1F1D; --ink:#F2F1EC; --muted:#A8A69D; --line:#44433F;
  --in:#E08A67; --in-soft:#4A3128; --out:#9DB6E0; --out-soft:#2B3445;
  --warn:#E6B865; --warn-soft:#3A2F1B; --ok:#7FD0A2; --ok-soft:#1E3A2B; --green:#0B5E34; --green-deep:#084A29; --on-green:#FFFFFF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;line-height:1.2}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.num-t{font-variant-numeric:tabular-nums}

.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 28px;background:var(--green);color:var(--on-green)}
.top .brand h1{color:var(--on-green)}
.top .brand p{color:rgba(255,255,255,.82)}
.top .brand p.dev{color:var(--on-green)}
.top svg rect{stroke:rgba(255,255,255,.5)}
.top svg path{stroke:#FFFFFF}
.top svg circle{fill:#F0B08F}
.top .btn{background:transparent;border-color:rgba(255,255,255,.65);color:var(--on-green)}
.top .btn:hover{background:rgba(255,255,255,.14)}
.top .proto.ok{background:rgba(255,255,255,.14);color:var(--on-green)}
.themepick{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:rgba(255,255,255,.85)}
.themepick select{background:var(--green-deep);color:var(--on-green);border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:4px 8px;font-size:13px}
.brand{display:flex;align-items:center;gap:14px}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.brand p{margin:0;color:var(--muted);font-size:13.5px}
.brand p.dev{color:var(--ink);font-weight:600;font-size:13px;margin-top:2px}
.citebox{border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.citebox .solhead{width:100%}
.citetext{margin:0;font-family:var(--serif);font-size:16px;line-height:1.55;overflow-wrap:anywhere}
.reflist{font-family:var(--serif);font-size:15px;line-height:1.55}
.reflist p{margin:0 0 6px;padding-left:28px;text-indent:-28px;overflow-wrap:anywhere}
.credit{font-size:14px;color:var(--muted);margin:0}
.proto{font-size:13px;color:var(--warn);background:var(--warn-soft);padding:6px 12px;border-radius:999px;max-width:100%;text-decoration:none}
.proto.ok{color:var(--ok);background:var(--ok-soft)}
.proto.ok:hover{text-decoration:underline}

.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;max-width:1320px;margin:0 auto;padding:28px}
.rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);align-self:start;background:var(--green);border-radius:14px;padding:10px}
.stepbtn{display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:10px 12px;border-radius:8px;cursor:pointer;color:rgba(255,255,255,.82);font-weight:500}
.stepbtn .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;border:1.5px solid rgba(255,255,255,.5);font-variant-numeric:tabular-nums}
.stepbtn:hover:not(:disabled){background:rgba(255,255,255,.13);color:#FFFFFF}
.stepbtn.done .n{background:rgba(255,255,255,.22);border-color:transparent;color:#FFFFFF}
.stepbtn.cur{color:var(--green-deep);background:#FFFFFF;font-weight:600}
.stepbtn.cur .n{background:var(--green);border-color:var(--green);color:#FFFFFF}
.stepbtn:disabled{opacity:.5;cursor:not-allowed}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 30px}
.phead{margin-bottom:22px}
.phead .pn{color:var(--muted);font-size:13.5px}
.phead h2{font-size:27px;font-weight:700;letter-spacing:-.015em;margin-top:2px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:32px;align-items:start}
.pcontent{min-width:0;display:flex;flex-direction:column;gap:22px}
.guide{font-family:var(--serif);font-size:16.5px;line-height:1.6;border-left:3px solid var(--in-soft);padding:2px 0 2px 20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px)}
.guide h3{font-family:var(--sans);font-size:14px;font-weight:600;margin:18px 0 4px;color:var(--ink)}
.guide h3:first-child{margin-top:0}
.guide p{margin:0 0 8px}
.guide em{color:var(--muted)}
.pnav{display:flex;justify-content:space-between;gap:12px;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:9px 16px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:14.5px;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--in);border-color:var(--in);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--in)}
:root[data-theme="dark"] .btn.primary{color:#1F1F1D}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1F1F1D}}
.btn.ghost{background:none;border-color:transparent}
.btn.small{padding:5px 11px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.drop.over{border-color:var(--in);background:var(--in-soft)}
.drop .dt{font-size:18px;font-weight:600;margin:0}
.drop .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.muted{color:var(--muted)}
.note{margin:0;font-size:14px;color:var(--muted)}
.callout{padding:12px 16px;border-radius:8px;font-size:14.5px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.ok{background:var(--ok-soft);color:var(--ok)}
.callout.info{background:var(--in-soft);color:var(--ink)}

.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;background:var(--sunk);font-size:13px;color:var(--muted)}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
td.c,th.c{text-align:center}
tr.faded td{color:var(--muted);opacity:.65}
tr.sel td{background:var(--in-soft)}
.inp{width:74px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-variant-numeric:tabular-nums}
.inp.wide{width:100%}
.inp.bad{border-color:var(--out);background:var(--out-soft)}
.field{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:600}
.field span{color:var(--muted);font-weight:500}
.fields{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.sub{font-size:17px;font-weight:600}
.subblock{display:flex;flex-direction:column;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer;font-weight:600;font-size:14px;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{border-color:var(--in);background:var(--in-soft);color:var(--in)}
.chip.outc.on{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.dis{opacity:.4;cursor:not-allowed}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 11px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on[data-v="1"]{background:var(--in-soft);color:var(--in);font-weight:600}
.seg button.on[data-v="0"]{background:var(--out-soft);color:var(--out);font-weight:600}
.seg button.on[data-v="-"]{background:var(--sunk);color:var(--ink);font-weight:600}

.outbtn{min-width:36px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.outbtn.one{background:var(--in);border-color:var(--in);color:#fff}
.outbtn.zero{color:var(--muted)}
.outbtn.ovr{box-shadow:0 0 0 2px var(--warn)}
.bit1{color:var(--in);font-weight:700}
.bit0{color:var(--out)}

.curvebox{border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.curvebox svg{width:100%;height:auto;display:block}
.curvehead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.stats{display:flex;gap:22px;flex-wrap:wrap;font-size:13.5px;color:var(--muted)}
.stats b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}

.chart td.c{padding:6px 14px}
.chart .symrow td:first-child{font-weight:600}
.chart tr.metric td{font-variant-numeric:tabular-nums;color:var(--muted)}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13.5px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.sym{vertical-align:middle}
.methods{font-family:var(--serif);font-size:16px;line-height:1.65;background:var(--sunk);border-radius:10px;padding:16px 20px;margin:0}
.solhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.solnote{font-size:14px;color:var(--muted);margin:0}
.flip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.flip b{font-size:15px}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14.5px}
.toggle input{width:17px;height:17px;accent-color:var(--in)}

#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:rgba(10,15,16,.55);display:none;place-items:center;z-index:30;padding:20px}
#modal.show{display:grid}
#modal .box{background:var(--surface);border-radius:12px;padding:20px;width:min(720px,100%);display:flex;flex-direction:column;gap:12px}
#modal textarea{width:100%;height:300px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg);color:var(--ink)}

.term{border-bottom:1.5px dotted currentColor;cursor:help;position:relative;text-decoration:none}
.term:hover::after,.term:focus::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 6px);width:max-content;max-width:260px;background:var(--ink);color:var(--surface);padding:8px 11px;border-radius:7px;font:400 13px/1.45 var(--sans);letter-spacing:0;text-transform:none;white-space:normal;text-align:left;z-index:15;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.todo{background:var(--in-soft);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:6px}
.todo-h{font-weight:700;font-size:15px;color:var(--in)}
.todo p{margin:0;font-size:15px}
.plan{border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.plan-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;font-size:16px}
.plan-n{font-size:13px;font-weight:600;color:var(--in);background:var(--in-soft);padding:2px 9px;border-radius:999px}
.plan-f,.plan-w{margin:0;font-size:14.5px}
.plan-w{color:var(--muted)}
.plan .row,.subblock .row{display:flex;gap:8px;flex-wrap:wrap}
.arrowcell{display:flex;flex-direction:column;gap:6px;white-space:normal;min-width:220px}
.arrowcell .note{white-space:normal}
.chip.small{padding:4px 11px;font-size:13px}
.plain{font-family:var(--serif);font-size:16.5px;line-height:1.6}
.plain p{margin:0 0 10px}
details.adv{border:1px solid var(--line);border-radius:10px;padding:12px 16px}
details.adv summary{cursor:pointer;font-weight:600}
details.adv[open] summary{margin-bottom:12px}
.navr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.topr{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.modepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.modeopt{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer}
.modeopt input{position:absolute;opacity:0;pointer-events:none}
.modeopt span{font-size:13.5px;color:var(--muted)}
.modeopt.on{border-color:var(--in);background:var(--in-soft)}
.modeopt:focus-within{outline:2px solid var(--in);outline-offset:2px}
.exportgrid{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:1080px){
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .guide{position:static;order:-1;border-left:0;border-top:3px solid var(--in-soft);padding:14px 0 0}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding:16px;gap:16px}
  .rail{position:static;flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .stepbtn{flex:none;padding:8px 10px}
  .stepbtn .t{display:none}
  .stepbtn.cur .t{display:inline}
  .panel{padding:20px 18px}
  .top{padding:14px 16px}
  .phead h2{font-size:23px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>

<header class="top">
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
      <rect x="1" y="1" width="38" height="38" rx="9" fill="none" stroke="var(--line)" stroke-width="1.5"/>
      <path d="M6 32 C 16 32, 15 20, 20 20 S 24 8, 34 8" fill="none" stroke="var(--in)" stroke-width="3" stroke-linecap="round"/>
      <circle cx="20" cy="20" r="3" fill="var(--out)"/>
    </svg>
    <div><h1>SaNaSoft</h1><p>Guided fuzzy-set QCA for PLS-SEM latent variable scores</p><p class="dev">Developed by Prof. S. Sabraz Nawaz and Prof. Ghazanfar Ali</p></div>
  </div>
  <div class="topr"><label class="themepick">Theme<select id="theme" aria-label="Colour theme"><option value="light">Light</option><option value="dark">Dark</option><option value="auto">Match device</option></select></label><button class="btn small" id="saveproj" hidden>Save project</button><a class="proto ok" href="https://claude.ai/artifact/TKGZjhbKJs7bXjW8hHDChv" target="_blank" rel="noopener">Validated against R QCA 3.25.5 on 241 benchmark cases. Read the report</a></div>
</header>
<div class="layout">
  <nav class="rail" id="rail" aria-label="Analysis steps"></nav>
  <main id="main"></main>
</div>
<div id="toast" role="status"></div>
<div id="modal"><div class="box"><div class="sub">Copy this text</div><p class="note">Select all and copy, then paste into Excel, Word or a text file.</p><textarea id="modaltext" readonly></textarea><div><button class="btn" id="modalclose">Close</button></div></div></div>

<script>
// ===== ENGINE START =====
function calibrateValue(x, full, cross, non, L){
  if(!Number.isFinite(x)) return NaN;
  L=L||3; let lo;
  if(full>non){ lo = x>=cross ? (x-cross)*L/(full-cross) : (x-cross)*L/(cross-non); }
  else { lo = x<=cross ? (cross-x)*L/(cross-full) : (cross-x)*L/(non-cross); }
  return 1/(1+Math.exp(-lo));
}
function validAnchors(a){
  return a && [a.full,a.cross,a.non].every(Number.isFinite) &&
    ((a.full>a.cross && a.cross>a.non) || (a.full<a.cross && a.cross<a.non));
}
function necessity(X,Y){
  let sxy=0,sx=0,sy=0,snx=0,snm=0;
  for(let i=0;i<X.length;i++){ const m=Math.min(X[i],Y[i]); sxy+=m; sx+=X[i]; sy+=Y[i]; snx+=1-X[i]; snm+=1-m; }
  return {cons:sxy/sy, cov:sxy/sx, ron:snx/snm};
}
function rowStr(idx,k){ let s=''; for(let j=0;j<k;j++) s+=(idx>>(k-1-j))&1; return s; }
function termMembership(term, conds){
  const n=conds[0].length, out=new Array(n);
  for(let i=0;i<n;i++){
    let m=1;
    for(let j=0;j<term.length;j++){ const t=term[j]; if(t==='-') continue; const v=t==='1'?conds[j][i]:1-conds[j][i]; if(v<m) m=v; }
    out[i]=m;
  }
  return out;
}
function fitStats(M,Y){
  let smy=0,sm=0,sy=0,smyny=0;
  for(let i=0;i<M.length;i++){ const my=Math.min(M[i],Y[i]); smy+=my; sm+=M[i]; sy+=Y[i]; smyny+=Math.min(my,1-Y[i]); }
  return {incl:smy/sm, cov:smy/sy, pri:(smy-smyny)/(sm-smyny)};
}
function truthTable(conds, Y){
  const k=conds.length, n=Y.length, R=1<<k, counts=new Array(R).fill(0);
  let ambiguous=0;
  for(let i=0;i<n;i++){
    let idx=0, amb=false;
    for(let j=0;j<k;j++){ const v=conds[j][i]; if(v===0.5) amb=true; idx=(idx<<1)|(v>0.5?1:0); }
    if(amb) ambiguous++; else counts[idx]++;
  }
  const rows=[];
  for(let r=0;r<R;r++){
    const str=rowStr(r,k);
    let st={incl:NaN,pri:NaN};
    if(counts[r]>0) st=fitStats(termMembership(str,conds),Y);
    rows.push({idx:r,str,n:counts[r],incl:st.incl,pri:st.pri});
  }
  return {rows, ambiguous};
}
function combineTerms(a,b){
  let diff=-1;
  for(let i=0;i<a.length;i++){
    if(a[i]!==b[i]){ if(a[i]==='-'||b[i]==='-') return null; if(diff>=0) return null; diff=i; }
  }
  if(diff<0) return null;
  return a.slice(0,diff)+'-'+a.slice(diff+1);
}
function primeImplicants(minterms){
  let cur=[...new Set(minterms)];
  const P=new Set();
  while(cur.length){
    const used=new Set(), next=new Set();
    for(let i=0;i<cur.length;i++) for(let j=i+1;j<cur.length;j++){
      const c=combineTerms(cur[i],cur[j]);
      if(c){ used.add(cur[i]); used.add(cur[j]); next.add(c); }
    }
    cur.forEach(t=>{ if(!used.has(t)) P.add(t); });
    cur=[...next];
  }
  return [...P];
}
function covers(t,m){ for(let i=0;i<t.length;i++){ if(t[i]!=='-' && t[i]!==m[i]) return false; } return true; }

  if(dvs.length===1 && vs.some(v=>S.roles[v]==='med')){
    const f=vs.filter(v=>['iv','med','mod'].includes(S.roles[v]));
    const main=out.find(p=>p.result===dvs[0]);
    if(!main||f.length!==main.factors.length) out.push({key:'whole',result:dvs[0],factors:f,kind:'whole'});
  }
  return out;
}
function planTitle(p){ return p.kind==='whole'?`Whole model: what leads to ${p.result}?`:`What leads to ${p.result}?`; }
function startPlan(p,neg,jump){
  S.robust=null; S.predict=null; S.xySel=0;
  S.outcome=p.result; S.conditions=[...p.factors]; S.negate=!!neg; S.planName=planTitle(p);
  S.overrides={}; S.dirExp={}; S.freqAuto=true;
  S.step = jump!=null? jump : 3; render(); scrollTop();
}

function sampleRows(){
  const rnd=mulberry32(7);
  const g=()=>{ let u=0; while(!u) u=rnd(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*rnd()); };
  const names=['PE','EE','SI','TAITA','FC','AIL','BI','UB'], L=Object.fromEntries(names.map(n=>[n,[]]));
  for(let i=0;i<320;i++){
    const c=g();
    const x={PE:.5*c+.85*g(), EE:.5*c+.85*g(), SI:.35*c+.9*g(), TAITA:.45*c+.85*g(), FC:.4*c+.9*g(), AIL:.3*c+.95*g()};
    x.BI=.3*x.PE+.12*x.EE+.18*x.SI+.22*x.TAITA+.1*x.FC+.15*x.AIL+.3*Math.min(x.PE,x.AIL)+.5*g();
    x.UB=.55*x.BI+.25*x.FC+.15*x.AIL+.6*g();
    names.forEach(n=>L[n].push(x[n]));
  }
  names.forEach(n=>{ const m=meanOf(L[n]), sd=sdOf(L[n]); L[n]=L[n].map(v=>Math.round((v-m)/sd*1000)/1000); });
  return L.PE.map((_,i)=>Object.fromEntries(names.map(n=>[n,L[n][i]])));
}
function parseCSV(text){
  const lines=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','||ch===';'||ch==='\t'){ row.push(cell); cell=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); lines.push(row); row=[]; cell=''; }
    else cell+=ch;
  }
  if(cell||row.length){ row.push(cell); lines.push(row); }
  const head=lines.shift()||[];
  return lines.filter(l=>l.some(x=>x!=='')).map(l=>Object.fromEntries(head.map((h,i)=>[h.trim(),l[i]??null])));
}
async function handleFile(file){
  try{

    else if(/\.csv$/i.test(file.name)){ rows=parseCSV(await file.text()); }
    else { toast('Excel reading is unavailable here; save the file as CSV'); return; }
    loadRows(rows,file.name); render();
  }catch(e){ toast('Could not read that file. Save it as CSV and try again.'); }
}
function todo(html){ return `<div class="todo"><div class="todo-h">What to do here</div>${html}</div>`; }
function excludedNote(){
  if(!S.excluded||!S.excluded.length) return '';

{ title:'Describe your model',
  guide:`<h3>The four roles</h3><p><b>Dependent variable:</b> the final result in your model. Arrows end here, for example BVC or use behaviour.</p><p><b>Independent variable:</b> a predictor. Arrows start here, for example AAIR or performance expectancy.</p><p><b>Mediator:</b> sits in the middle. It receives arrows and sends an arrow onward, for example HAIC or behavioural intention.</p><p><b>Moderator:</b> changes the strength of a relationship. In SmartPLS it has a dotted arrow pointing at another arrow, for example AIGM or AI literacy.</p><h3>Do mediators and moderators go in?</h3><p>Yes. fsQCA looks at combinations, so it handles both naturally.</p><p>A <b>moderator</b> is included as an ordinary ${TM.factors('factor')}. If it matters, it shows up in the ${TM.recipe('recipes')} together with the factors it strengthens. No moderation term is needed.</p><p>A <b>mediator</b> is analysed twice: once as a result of the variables that point to it, and once as a factor for the dependent variable. Recipes that combine a predictor with the mediator point to the indirect route you tested in SmartPLS.</p>`,

    }).join('');
    return todo(`<p>Look at your SmartPLS model diagram. For each variable, choose its role. For predictors, mediators and moderators, tick where their arrows go.</p><p>SaNaSoft then suggests which analyses to run. Start with Analysis 1, then come back here for the others.</p>`)+

    const ps=plans();
    $$('[data-plan]').forEach(b=>b.onclick=()=>startPlan(ps[+b.dataset.plan], b.dataset.neg==='1'));
    $$('input[name="out"]').forEach(el=>el.onchange=()=>{ S.outcome=el.value; S.conditions=S.conditions.filter(c=>c!==el.value); S.planName=''; S.overrides={}; S.freqAuto=true; render(); $('details.adv').open=true; });
    $$('[data-cond]').forEach(el=>el.onchange=()=>{ const v=el.value; S.conditions=el.checked?vars().filter(x=>x===v||S.conditions.includes(x)):S.conditions.filter(c=>c!==v); if(S.conditions.length>10){ S.conditions=S.conditions.filter(c=>c!==v); toast('Up to 10 factors'); } S.planName=''; S.overrides={}; S.freqAuto=true; render(); $('details.adv').open=true; });
  }
},
{ title:'Convert scores to 0–1',
  guide:`<h3>What this step is</h3><p>fsQCA asks, for each respondent, “how much does this person belong to the group with high AAIR?” The answer runs from 0 (clearly low) to 1 (clearly high). This step, called ${TM.convert('calibration')} in papers, converts your scores into those 0–1 values.</p><h3>The three reference points</h3><p><b>Clearly high</b> (0.95), <b>middle point</b> (0.5) and <b>clearly low</b> (0.05).</p><p>For <b>standardised scores</b>, SaNaSoft takes these from your data: the 95th, 50th and 5th percentiles, which is what most published studies do.</p><p>For <b>scores on your questionnaire scale</b>, it uses the scale’s wording: on a 1–7 scale, 6 (agree), 4 (neutral) and 2 (disagree).</p><h3>For your robustness check</h3><p>Later, come back and click the 90 / 50 / 10 button, rerun your analysis and see whether the recipes stay the same. Reviewers expect this.</p><h3>The tick box</h3><p>A respondent exactly at the middle point belongs to neither group and would be dropped. The tick box nudges them to 0.501 so they stay in (Fiss, 2011).</p>`,
  render(){
    const used=new Set([...S.conditions,S.outcome]);
    const rows=vars().filter(v=>used.has(v)).map(v=>{
      const a=S.calib[v], ok=validAnchors(a), sc=S.scores[v];
      let pin='–', at='–';
      if(ok){ const c=sc.map(x=>cv(x,a)).filter(Number.isFinite); pin=pc(c.filter(x=>x>0.5).length/c.length); at=c.filter(x=>x===0.5).length; }
      const src={pct:'95 / 50 / 5 percentiles (recommended)',pct90:'90 / 50 / 10 percentiles',scale:'Scale points (recommended)',custom:'Your own'}[S.calibSrc[v]]||'Your own';
      return `<tr class="${S.selCal===v?'sel':''}"><td><button class="btn small ghost" data-sel="${esc(v)}" style="padding:3px 6px">${esc(v)}</button></td>
        ${['full','cross','non'].map(k=>`<td><input class="inp ${ok?'':'bad'}" type="number" step="0.01" data-an="${esc(v)}" data-k="${k}" value="${a[k]}"></td>`).join('')}
        <td class="muted">${src}</td><td class="r">${pin}</td><td class="r">${at}</td></tr>`;
    }).join('');
    return todo(`<p>The recommended settings are already filled in. Leave the tick box on and click Continue.</p><p>Only change the numbers if you have a clear reason. Click a variable’s name to see its curve.</p>`)+
      `<div class="fields"><button class="btn small" id="allpct">${S.mode==='raw'?`Use recommended (scale ${defaultAnchors().full} / ${defaultAnchors().cross} / ${defaultAnchors().non}; percentiles for standardised scores)`:'Use recommended: 95 / 50 / 5 percentiles'}</button>
      ${S.mode==='raw'?'<button class="btn small" id="allpctonly">Use 95 / 50 / 5 percentiles for all</button>':''}<button class="btn small" id="allpct90">Robustness check: 90 / 50 / 10 percentiles</button></div>
      <div class="curvebox" id="curve"></div>
      <div class="scroll"><table><thead><tr><th>Variable</th><th>Clearly high (0.95)</th><th>Middle point (0.5)</th><th>Clearly low (0.05)</th><th>Setting</th><th class="r">Share in the high group</th><th class="r">At the middle</th></tr></thead><tbody>${rows}</tbody></table></div>
      <label class="toggle"><input type="checkbox" id="fix" ${S.fix05?'checked':''}> Keep respondents who sit exactly at the middle point (recommended)</label>
      <label class="field" style="max-width:520px">Conversion formula<select class="inp" id="calstd" style="width:auto"><option value="fsqca" ${S.calStd!=='r'?'selected':''}>Same as fsQCA 4.x software, Ragin’s method (recommended)</option><option value="r" ${S.calStd==='r'?'selected':''}>Same as the R QCA package</option></select><span>The two differ only slightly: clearly high becomes 0.953 in fsQCA and 0.950 in R. Pick the one your field’s papers usually cite.</span></label>
      <div><button class="btn small" id="copycal">Copy converted scores</button> <span class="note">For checking the results in fsQCA 4.0 or R.</span></div>`;
  },
  bind(){
    const used=[...S.conditions,S.outcome];
    if(!used.includes(S.selCal)) S.selCal=S.outcome;
    drawCurve();
    $$('[data-sel]').forEach(el=>el.onclick=()=>{ S.selCal=el.dataset.sel; render(); });
    $$('[data-an]').forEach(el=>{
      el.oninput=()=>{ S.calib[el.dataset.an][el.dataset.k]=num(el.value); S.calibSrc[el.dataset.an]='custom'; if(S.selCal===el.dataset.an) drawCurve(); };
      el.onchange=()=>{ S.selCal=el.dataset.an; S.overrides={}; render(); };
    });
    $('#allpct').onclick=()=>{ vars().forEach(setRecommended); S.overrides={}; render(); toast('Recommended settings applied'); };
    const ap5=$('#allpctonly'); if(ap5) ap5.onclick=()=>{ vars().forEach(v=>{ S.calib[v]=pctAnchors(v); S.calibSrc[v]='pct'; }); S.overrides={}; render(); };
    $('#allpct90').onclick=()=>{ vars().forEach(v=>{ S.calib[v]=pctAnchors(v,.9,.1); S.calibSrc[v]='pct90'; }); S.overrides={}; render(); toast('Robustness settings applied: 90 / 50 / 10'); };
    $('#fix').onchange=e=>{ S.fix05=e.target.checked; render(); };
    $('#calstd').onchange=e=>{ S.calStd=e.target.value; S.overrides={}; render(); };
    $('#copycal').onclick=()=>{
      const vs=vars().filter(v=>validAnchors(S.calib[v])); const cal=Object.fromEntries(vs.map(v=>[v,calibrated(v)]));
      const lines=['case\t'+vs.join('\t')].concat(S.raw.map((_,i)=>(i+1)+'\t'+vs.map(v=>Number.isFinite(cal[v][i])?cal[v][i].toFixed(4):'').join('\t')));
      copyText(lines.join('\n'),'Converted scores');
    };
  }
},
{ title:'Must-have factors',
  guide:`<h3>What this step is</h3><p>It checks whether any factor is a ${TM.musthave()}: something the result almost never happens without. For example, “high BVC hardly ever occurs without high HAIC.”</p><h3>How to read it</h3><p>A ${TM.rel('reliability')} of 0.90 or more means must-have. The ${TM.relev('relevance')} column guards against trivial cases: a factor that nearly everyone has can look essential without really being so.</p><h3>Usual finding</h3><p>With survey data, most factors are not must-haves. That is normal, and you simply report it.</p>`,
  render(){
    const d=analysisData();
    const rows=d.names.flatMap((n,j)=>[{n,hi:true,X:d.conds[j]},{n,hi:false,X:d.conds[j].map(v=>1-v)}]).map(r=>Object.assign(r,necessity(r.X,d.Y)));
    const nec=rows.filter(r=>r.cons>=0.9&&r.ron>=0.5), triv=rows.filter(r=>r.cons>=0.9&&r.ron<0.5);
    const summary= nec.length? `<div class="callout ok"><b>${nec.map(r=>(r.hi?'High ':'Low ')+esc(r.n)).join(', ')}</b> ${nec.length>1?'are must-have factors':'is a must-have factor'} for ${esc(d.plainOut)}: the result almost never occurs without ${nec.length>1?'them':'it'}. Report this in your paper.</div>`
      : `<div class="callout info">None of the factors is a must-have for ${esc(d.plainOut)}. This is common with survey data. Report it in one sentence and continue.</div>`;
    return flipBar(d)+todo(`<p>Nothing to enter. Read the summary below, then click Continue.</p>`)+summary+
      (triv.length?`<div class="callout warn">${triv.map(r=>(r.hi?'High ':'Low ')+esc(r.n)).join(', ')} passes the must-have test, but its relevance is low, so it is probably trivial. Mention it with that caveat.</div>`:'')+
      `<div class="scroll"><table><thead><tr><th>Factor</th><th class="r">${TM.rel('Reliability')}</th><th class="r">${TM.share('Share explained')}</th><th class="r">${TM.relev('Relevance')}</th><th>Verdict</th></tr></thead><tbody>
      ${rows.map(r=>{ const ok=r.cons>=0.9; return `<tr><td><b class="${r.hi?'bit1':'bit0'}">${r.hi?'High':'Low'} ${esc(r.n)}</b> <span class="note">(${r.hi?'':'~'}${esc(r.n)})</span></td><td class="r">${f3(r.cons)}</td><td class="r">${f3(r.cov)}</td><td class="r">${f3(r.ron)}</td><td>${ok?(r.ron<0.5?'<span style="color:var(--warn)">Must-have, but probably trivial</span>':'<span style="color:var(--ok);font-weight:600">Must-have</span>'):'<span class="muted">Not a must-have</span>'}</td></tr>`; }).join('')}
      </tbody></table></div>${d.dropped?`<p class="note">${d.dropped} respondents with missing values were left out.</p>`:''}`;
  },
  bind(){ bindFlip(); }
},
{ title:'Combination table',
  guide:`<h3>What this step is</h3><p>Every respondent has a pattern of high and low factors, such as “high AAIR, high HAIC, low AIGM”. The ${TM.table()} lists each pattern, how many respondents have it, and whether it reliably goes with the result.</p><h3>The three settings</h3><p><b>${TM.minn('Minimum respondents')}</b>: patterns with fewer respondents are set aside as too rare to trust. SaNaSoft picks a value that keeps at least 80% of respondents.</p><p><b>${TM.rel('Reliability')} cutoff</b>: 0.80 is the usual published value.</p><p><b>${TM.clean('Clean-signal')} cutoff</b>: 0.70 is a safe value. It stops patterns that lead to both high and low results from counting.</p><h3>Changing a row</h3><p>You can click “Yes” or “No” to change a row by hand, but only with a reason you could defend to a reviewer. Changed rows are outlined.</p>`,
  render(){
    const {d,tt,total,map,esa}=currentTT();
    const rowsAll=tt.rows.filter(r=>r.n>0);
    const byN=[...rowsAll].sort((a,b)=>b.n-a.n);
    let cum=0; const cumMap={}; byN.forEach(r=>{ cum+=r.n; cumMap[r.idx]=cum/total; });
    const rows=S.ttSort==='n'?byN:[...rowsAll].sort((a,b)=>(b.incl-a.incl)||(b.n-a.n));
    const kept=rowsAll.filter(r=>r.n>=S.freq).reduce((s,r)=>s+r.n,0);
    const pos=rowsAll.filter(r=>map[r.idx]===1).length;
    const rf=recFreq(tt.rows,total), isRec=S.freq===rf&&S.incl===0.8&&S.pri===0.7;
    return flipBar(d)+todo(`<p>${isRec?'The recommended settings are already applied. Click Continue.':'You have changed the settings. Click “Use recommended settings” to go back to them.'}</p>
      <p>For your ${total} respondents SaNaSoft recommends a minimum of <b>${rf}</b> respondents per pattern, a reliability cutoff of <b>0.80</b> and a clean-signal cutoff of <b>0.70</b>.</p>`)+
      `<div class="fields">
      <label class="field">${TM.minn('Minimum respondents')}<input class="inp" id="freq" type="number" min="1" step="1" value="${S.freq}"></label>
      <label class="field">${TM.rel('Reliability')} cutoff<input class="inp" id="incl" type="number" min="0" max="1" step="0.01" value="${S.incl}"></label>
      <label class="field">${TM.clean('Clean-signal')} cutoff<input class="inp" id="pri" type="number" min="0" max="1" step="0.01" value="${S.pri}"></label>
      <button class="btn small" id="rec" ${isRec?'disabled':''}>Use recommended settings</button>
      <label class="field">Sort by<select class="inp" id="sort" style="width:auto"><option value="n" ${S.ttSort==='n'?'selected':''}>Respondents</option><option value="incl" ${S.ttSort==='incl'?'selected':''}>Reliability</option></select></label></div>
      <div class="callout ${kept/total>=0.8?'ok':'warn'}">The patterns kept cover ${kept} of ${total} respondents (${pc(kept/total)}${kept/total>=0.8?', above the 80% target':', below the 80% target: lower the minimum'}). ${pos} pattern${pos===1?' leads':'s lead'} reliably to ${esc(d.plainOut)}.${tt.ambiguous?` ${tt.ambiguous} respondents sit exactly at a middle point and are left out; turn the tick box on in step 4 to keep them.`:''}</div>
      <div class="scroll"><table><thead><tr>${d.names.map(n=>`<th class="c">${esc(n)}</th>`).join('')}<th class="r">Respondents</th><th class="r">Running total</th><th class="r">${TM.rel('Reliability')}</th><th class="r">${TM.clean('Clean signal')}</th><th class="c">Leads to ${esc(d.plainOut)}?</th></tr></thead><tbody>
      ${rows.map(r=>{ const m=map[r.idx], rem=m===null, ovr=(r.idx in S.overrides)&&!rem;
        return `<tr class="${rem?'faded':''}">${r.str.split('').map(b=>`<td class="c ${b==='1'?'bit1':'bit0'}">${b==='1'?'High':'Low'}</td>`).join('')}
        <td class="r">${r.n}</td><td class="r">${pc(cumMap[r.idx])}</td><td class="r">${f3(r.incl)}</td><td class="r">${f3(r.pri)}</td>
        <td class="c">${rem?'<span class="muted">Too few</span>':`<button class="outbtn ${m===1?'one':'zero'} ${ovr?'ovr':''}" data-idx="${r.idx}" data-v="${m}">${m===1?'Yes':'No'}</button>`}</td></tr>`; }).join('')}
      </tbody></table></div>
      <p class="note">${2**d.names.length-rowsAll.length} other patterns have no respondents at all. Rows marked “Too few” are set aside.</p>
      <div class="subblock"><label class="toggle"><input type="checkbox" id="esa" ${S.esa?'checked':''}> Block unrealistic assumptions (${tip('Enhanced Standard Analysis','Schneider & Wagemann (2012). It stops fsQCA from making assumptions about rare patterns that contradict each other or contradict a must-have factor.')}, recommended)</label>
      <p class="note">To simplify recipes, fsQCA makes assumptions about patterns with too few respondents. With this on, SaNaSoft refuses assumptions that would be used both for high and for low ${esc(S.outcome)} (a contradiction), and assumptions that ignore a must-have factor.${S.esa?` For this analysis it blocked <b>${esa.csa.length}</b> contradictory assumption${esa.csa.length===1?'':'s'} and <b>${esa.necRows.filter(x=>!esa.csa.includes(x)).length}</b> that ignore${esa.necRows.length===1?'s':''} a must-have factor.`:''}</p></div>`;
  },
  bind(){
    bindFlip();
    $('#freq').onchange=e=>{ S.freq=Math.max(1,Math.round(num(e.target.value))||1); S.freqAuto=false; S.overrides={}; render(); };
    $('#incl').onchange=e=>{ S.incl=num(e.target.value); S.overrides={}; render(); };
    $('#pri').onchange=e=>{ S.pri=num(e.target.value); S.overrides={}; render(); };
    $('#rec').onclick=()=>{ S.freqAuto=true; S.incl=0.8; S.pri=0.7; S.overrides={}; render(); toast('Recommended settings applied'); };
    $('#sort').onchange=e=>{ S.ttSort=e.target.value; render(); };
    $('#esa').onchange=e=>{ S.esa=e.target.checked; S.robust=null; S.predict=null; render(); };
    $$('.outbtn').forEach(el=>el.onclick=()=>{ S.overrides[+el.dataset.idx]=el.dataset.v==='1'?0:1; render(); });
  }
},
{ title:'Recipes',
  guide:`<h3>What this step is</h3><p>SaNaSoft simplifies the reliable patterns into ${TM.recipe('recipes')}: combinations of factors that lead to the result. There can be several recipes, meaning different groups of respondents reach the same result in different ways.</p><h3>${TM.expect('What your theory expects')}</h3><p>For each factor, say whether it helps when high or when low. Use your SmartPLS results: a positive path means “helps when high”. Choose “Not sure” if theory is unclear.</p><h3>Reading the chart</h3><p>A large dot is a ${TM.key()}, with strong evidence. A small dot is a ${TM.support()}. A crossed circle means the factor must be low. A blank means it doesn’t matter in that recipe.</p><h3>Benchmarks</h3><p>Overall ${TM.rel('reliability')} should be at least 0.80. ${TM.share('Share explained')} has no fixed cutoff, but report it.</p>`,
  render(){
    const {d,tt,map,esa}=currentTT(); window._esa=esa;
    const de=d.names.map(dirFor);
    const res=solveTruthTable(d.conds,d.Y,tt.rows,map,de,S.modelChoice[sig()]);
    const exp=`<div class="subblock"><div class="sub">${TM.expect('What your theory expects')}</div><div class="scroll"><table><tbody>${d.names.map(n=>`<tr><td><b>${esc(n)}</b></td><td><div class="seg" data-de="${esc(n)}">${[['1','Helps when high'],['0','Helps when low'],['-','Not sure']].map(([v,l])=>`<button data-v="${v}" class="${dirFor(n)===v?'on':''}">${l}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div></div>`;
    const guideBox=todo(`<p>${S.negate?`For low ${esc(S.outcome)}, SaNaSoft assumes each factor helps when low: the reverse of your model.`:'SaNaSoft assumes each factor helps when high, which matches positive paths in SmartPLS.'} If a path in your SmartPLS model was negative, switch that factor to “${S.negate?'Helps when high':'Helps when low'}”. Otherwise, leave these as they are.</p><p>Then read the recipes and the summary. Copy the table and the paragraph into your paper.</p>`);
    const next=nextButtons();
    if(!res) return flipBar(d)+guideBox+exp+`<div class="callout warn">No pattern passed the settings in step 6, so there are no recipes for ${esc(d.plainOut)}. That is itself a finding: none of the combinations reliably leads to ${esc(d.plainOut)}. Report it rather than lowering the cutoffs just to get a result.</div>`+next;
    window._last={d,res,de,tt,map};
    const I=res.inter;
    const chart=`<div class="subblock"><div class="solhead"><div class="sub">Recipes for ${esc(d.plainOut)}</div><button class="btn small" id="copychart">Copy table for your paper</button></div>
      <div class="scroll"><table class="chart"><thead><tr><th>Factor</th>${I.terms.map((_,i)=>`<th class="c">Recipe ${i+1}</th>`).join('')}</tr></thead><tbody>
      ${d.names.map((n,j)=>`<tr class="symrow"><td>${esc(n)}</td>${I.terms.map(t=>`<td class="c">${symbol(t.term[j],I.core.get(t.term).has(j))}</td>`).join('')}</tr>`).join('')}
      <tr class="metric"><td>${TM.rel('Reliability')}</td>${I.terms.map(t=>`<td class="c">${f3(t.incl)}</td>`).join('')}</tr>
      <tr class="metric"><td>${TM.share('Share explained')}</td>${I.terms.map(t=>`<td class="c">${f3(t.cov)}</td>`).join('')}</tr>
      <tr class="metric"><td>${TM.uniq('Unique share')}</td>${I.terms.map(t=>`<td class="c">${f3(t.ucov)}</td>`).join('')}</tr>
      <tr class="metric"><td>Overall reliability</td><td class="c" colspan="${I.terms.length}">${f3(I.sol.incl)}</td></tr>
      <tr class="metric"><td>Overall share explained</td><td class="c" colspan="${I.terms.length}">${f3(I.sol.cov)}</td></tr>
      </tbody></table></div>
      <div class="legend"><span>${symbol('1',true)} High, ${TM.key()}</span><span>${symbol('1',false)} High, ${TM.support()}</span><span>${symbol('0',true)} Low, key ingredient</span><span>${symbol('0',false)} Low, supporting ingredient</span><span>Blank: doesn’t matter</span></div></div>`;
    const plain=`<div class="subblock"><div class="sub">What this means</div><div class="plain">${I.terms.map((t,i)=>{
        const core=I.core.get(t.term), parts=termPlain(t.term,d.names);
        const keyI=[...core].map(j=>(t.term[j]==='1'?'high ':'low ')+d.names[j]);
        const supI=parts.filter(p=>!keyI.includes(p));
        return `<p><b>Recipe ${i+1}:</b> ${esc(lst(parts))} ${parts.length>1?'together lead':'leads'} to ${esc(d.plainOut)}. Its reliability is ${f2(t.incl)} ${t.incl>=0.8?'(above the 0.80 benchmark)':'(below the 0.80 benchmark)'}, and it accounts for about ${pc(t.cov)} of ${esc(d.plainOut)}.${keyI.length&&supI.length?` Key ingredient${keyI.length>1?'s':''}: ${esc(lst(keyI))}; supporting: ${esc(lst(supI))}.`:''}</p>`; }).join('')}
      <p>${I.terms.length>1?`Together, the ${I.terms.length} recipes`:'This recipe'} account${I.terms.length>1?'':'s'} for about ${pc(I.sol.cov)} of ${esc(d.plainOut)}, with overall reliability ${f2(I.sol.incl)}.${I.terms.length>1?' Several recipes means different groups of respondents reach the same result in different ways.':''}</p>
      ${I.sol.incl<0.8?'<div class="callout warn">Overall reliability is below 0.80, so treat these recipes with caution.</div>':''}</div></div>`;
    const detail=(title,tech,s)=>`<div class="subblock"><div class="sub">${title} <span class="note">(${tech})</span></div>${s.ambiguous?`<p class="solnote">${s.nModels} equally simple versions fit; the first is shown. Mention this “model ambiguity” in your paper.</p>`:''}
      <div class="scroll"><table><thead><tr><th>Configuration</th><th class="r">Raw coverage</th><th class="r">Unique coverage</th><th class="r">Consistency</th></tr></thead><tbody>
      ${s.terms.map(t=>`<tr><td><b>${esc(termLabel(t.term,d.names))}</b></td><td class="r">${f3(t.cov)}</td><td class="r">${f3(t.ucov)}</td><td class="r">${f3(t.incl)}</td></tr>`).join('')}
      <tr><td class="muted">Solution</td><td class="r">${f3(s.sol.cov)}</td><td></td><td class="r">${f3(s.sol.incl)}</td></tr></tbody></table></div></div>`;
    return flipBar(d)+guideBox+exp+versionsBox(res)+chart+plain+extras(d,res)+
      `<div class="subblock"><div class="solhead"><div class="sub">Paragraph for your methods section</div><button class="btn small" id="copymeth">Copy paragraph</button></div>${(()=>{ const reg=citeRegistry(S.exp.style); const t=methodsText(d,res,de,tt,map,reg); window._methRefs=refList(reg); return `<p class="methods" id="meth">${esc(t)}</p><div class="reflist"><p><b>References</b></p>${window._methRefs.map(r=>`<p>${esc(r.prefix)}${segHTML(r.segs)}</p>`).join('')}</div>`; })()}<p class="note">Papers use the technical terms, so this paragraph does too. Citations follow the reference style chosen under “Download your results” (now: ${REF_STYLES.find(x=>x[0]===S.exp.style)[1]}). “Copy paragraph” copies the references too.</p></div>
      <details class="adv"><summary>Technical details for your paper</summary><p class="note">fsQCA papers usually report the intermediate solution, with core conditions taken from the parsimonious solution. SaNaSoft’s recipes above are the intermediate solution.</p>
      ${detail('Recommended solution','intermediate',I)}${detail('Simplest solution','parsimonious',res.pars)}${detail('Most detailed solution','complex',res.complex)}</details>`+next;
  },
  bind(){
    bindFlip(); bindNext(); bindExtras();
    $$('[data-de]').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.dirExp[seg.dataset.de]=b.dataset.v; render(); }));
    const cc=$('#copychart'); if(cc) cc.onclick=()=>{
      const {d,res}=window._last, I=res.inter;
      const sym=(c,core)=>c==='1'?(core?'●':'•'):c==='0'?(core?'⨂':'⊗'):'';
      const lines=['Condition\t'+I.terms.map((_,i)=>'Configuration '+(i+1)).join('\t')];
      d.names.forEach((n,j)=>lines.push(n+'\t'+I.terms.map(t=>sym(t.term[j],I.core.get(t.term).has(j))).join('\t')));
      lines.push('Raw coverage\t'+I.terms.map(t=>f3(t.cov)).join('\t'));
      lines.push('Unique coverage\t'+I.terms.map(t=>f3(t.ucov)).join('\t'));
      lines.push('Consistency\t'+I.terms.map(t=>f3(t.incl)).join('\t'));
      lines.push('Solution consistency\t'+f3(I.sol.incl)); lines.push('Solution coverage\t'+f3(I.sol.cov));

function caseGroups(d,term){

function runWith(o){
  const names=[...S.conditions], out=S.outcome;
  const A=v=> !o.anch? S.calib[v] : S.std[v]? (o.anch==='90'?pctAnchors(v,.9,.1):pctAnchors(v,.8,.2)) : (o.anch==='90'?defaultAnchors(-0.5):defaultAnchors(0.5));

  let idx=[]; for(let i=0;i<S.raw.length;i++) if([...names,out].every(n=>Number.isFinite(cal[n][i]))) idx.push(i);
  if(o.rows) idx=o.rows;
  const conds=names.map(n=>idx.map(i=>cal[n][i])); let Y=idx.map(i=>cal[out][i]); if(S.negate) Y=Y.map(v=>1-v);
  const tt=truthTable(conds,Y), total=idx.length-tt.ambiguous;
  const f=o.freq!=null?o.freq:(S.freqAuto?recFreq(tt.rows,total):S.freq);
  const incl=o.incl??S.incl, pri=o.pri??S.pri, map={};
  tt.rows.forEach(r=>{ map[r.idx]= r.n<f?null:(r.incl>=incl&&r.pri>=pri?1:0); });
  applyESA(conds,Y,tt.rows,map,f,incl,pri);
  const res=solveTruthTable(conds,Y,tt.rows,map,names.map(dirFor));

}
function recipeKey(res){ return res? res.inter.terms.map(t=>t.term).sort().join('|') : ''; }
function runRobustness(){

  const V=[['Your settings',{}],[allStd?'Reference points 90 / 50 / 10':`Narrower reference points (${allStd?'':`scale ${n1.full} / ${n1.cross} / ${n1.non}`}${[...S.conditions,S.outcome].some(v=>S.std[v])?'; percentiles 90 / 50 / 10':''})`,{anch:'90'}],[allStd?'Reference points 80 / 50 / 20':`Wider reference points (scale ${w1.full} / ${w1.cross} / ${w1.non}${[...S.conditions,S.outcome].some(v=>S.std[v])?'; percentiles 80 / 50 / 20':''})`,{anch:'80'}],
    ['Reliability cutoff 0.75',{incl:0.75}],['Reliability cutoff 0.85',{incl:0.85}],
    ['Clean-signal cutoff 0.60',{pri:0.6}],['Clean-signal cutoff 0.75',{pri:0.75}],

  const k0=recipeKey(base.res);

    return {label, recipes:r.res?r.res.inter.terms.map(t=>termLabel(t.term,r.names)):[], incl:r.res?r.res.inter.sol.incl:NaN, cov:r.res?r.res.inter.sol.cov:NaN, same:k===k0}; });

function runPredictive(){

    if(r.type==='article') return [`${A}, “${r.title},” `,I(r.journal),`, vol. ${r.volume}${r.issue?`, no. ${r.issue}`:''}, ${range?'pp. '+r.pages:'Art. no. '+r.pages}, ${Y}, doi: ${r.doi}.`];
    if(r.type==='book') return [`${A}, `,I(tc(r.title)),`. ${r.place}: ${r.publisher}, ${Y}.`];

  }
  if(r.type==='article') return [`${A}. ${lowerAfterColon(r.title)}. ${r.journal}. ${Y};${r.volume}${r.issue?`(${r.issue})`:''}:${r.pages.replace('–','-')}. doi:${r.doi}`];

function citeRegistry(style){
  const order=[];

    `Anchors correspond to fuzzy membership scores of .95, .50 and .05 (direct method; ${S.calStd==='r'?'R QCA logistic transformation':'Ragin’s logistic transformation as in fsQCA'}).${S.fix05?' Membership scores of exactly .50 were recoded to .501.':''}`,[20,16,14,18,32]);
  if(inc.nec) table(`Analysis of Necessary Conditions for ${outTitle}`,['Condition','Consistency','Coverage','RoN'],nec.map(n=>[n.c,apa(n.cons),apa(n.cov),apa(n.ron)]),
    `Tilde (~) denotes the absence of a condition. RoN = relevance of necessity. Conditions with consistency ≥ .90 and RoN ≥ .50 are considered necessary.`,[34,22,22,22]);
  if(inc.tt) table(`Truth Table for ${outTitle}`,[...d.names,'n','Raw consistency','PRI','Outcome'],rows.map(r=>[...r.str.split(''),r.n,apa(r.incl),apa(r.pri),map[r.idx]===null?'R':String(map[r.idx])]),
    `1 = condition present (membership > .50); 0 = absent. Rows are sorted by number of cases (n). Outcome coded 1 when raw consistency ≥ ${apa2(S.incl)} and PRI ≥ ${apa2(S.pri)}; R = logical remainder (fewer than ${S.freq} cases).${S.esa&&window._esa&&window._esa.csa.length?` Enhanced Standard Analysis excluded ${window._esa.csa.length} contradictory simplifying assumption${window._esa.csa.length===1?'':'s'}.`:''} Configurations without any cases are omitted.`,
    [...d.names.map(()=>10),8,15,10,11]);
  if(inc.conf){
    const S1=t=>new D.TextRun({text:t,size:30}), S2=t=>new D.TextRun({text:t,size:18});
    const sy=(c,core)=>c==='1'?(core?S1('●'):S2('●')):c==='0'?(core?S1('⊗'):S2('⊗')):new D.TextRun('');
    const k=I.terms.length;
    table(`Configurations Sufficient for ${outTitle}`,['Condition',...I.terms.map((_,i)=>`Configuration ${i+1}`)],
      [...d.names.map((n,j)=>[n,...I.terms.map(t=>({v:[sy(t.term[j],I.core.get(t.term).has(j))]}))]),
       ['Consistency',...I.terms.map(t=>apa(t.incl))],['Raw coverage',...I.terms.map(t=>apa(t.cov))],['Unique coverage',...I.terms.map(t=>apa(t.ucov))],
       ['Solution consistency',{v:apa(I.sol.incl),span:k},...Array(k-1).fill(null)].filter(x=>x!==null),['Solution coverage',{v:apa(I.sol.cov),span:k},...Array(k-1).fill(null)].filter(x=>x!==null)],
      `Large filled circles (●) indicate core conditions present; small filled circles indicate peripheral conditions present; large crossed circles (⊗) indicate core conditions absent; small crossed circles indicate peripheral conditions absent; blank cells indicate that the condition may be either present or absent ${reg('fiss')}. Intermediate solution; core conditions appear in both the parsimonious and intermediate solutions. Frequency threshold = ${S.freq}; raw consistency threshold = ${apa2(S.incl)}; PRI threshold = ${apa2(S.pri)}.`,
      [26,...I.terms.map(()=>Math.max(14,60/k))],{});
  }
  if(inc.rob&&S.robust) table(`Robustness Checks for ${outTitle}`,['Specification','Solution','Consistency','Coverage','Same'],S.robust.map(r=>[r.label,r.recipes.join(' + ')||'none',apa(r.incl),apa(r.cov),r.same?'Yes':'No']),
    `Each row reruns the analysis with one setting changed. “Same” indicates an intermediate solution identical to the main analysis.`,[30,24,15,14,9]);
  if(inc.pred&&S.predict&&!S.predict.none) table(`Predictive Validity of the Configurations for ${outTitle}`,['Configuration (subsample A)','Consistency (holdout B)','Coverage (holdout B)'],[...S.predict.per.map(p=>[p.label,apa(p.incl),apa(p.cov)]),['All configurations',apa(S.predict.sol.incl),apa(S.predict.sol.cov)]],
    `Configurations were identified in a random half of the sample (n = ${S.predict.nA}) and tested on the other half (n = ${S.predict.nB}), following the subsample and holdout approach ${reg('pappas')}.`,[46,27,27]);
  if(inc.xy){
    await figure(`XY Plot of the Solution Against ${outTitle}`,xySvgStandalone(Sm,d.Y,'Membership in the solution',`Membership in ${d.out}`),`Each point is a respondent. Points on or above the diagonal are consistent with sufficiency. Filled points: membership > .50 in both the solution and the outcome; open points: membership > .50 in the solution only. Solution consistency = ${apa(I.sol.incl)}, coverage = ${apa(I.sol.cov)}.`,600,520);
    for(let i=0;i<Math.min(I.terms.length,4)&&I.terms.length>1;i++){ const t=I.terms[i]; await figure(`XY Plot of Configuration ${i+1} (${termLabel(t.term,d.names)}) Against ${outTitle}`,xySvgStandalone(termMembership(t.term,d.conds),d.Y,`Membership in configuration ${i+1}`,`Membership in ${d.out}`),`Consistency = ${apa(t.incl)}, raw coverage = ${apa(t.cov)}.`,600,520); }
  }
  if(inc.plain){ kids.push(h1('Plain-Language Summary')); kids.push(body('For the author’s own use; not intended for publication.',{noIndent:true})); plainSentences(P).forEach(x=>kids.push(body(x))); }
  kids.push(h1('References'));
  refList(reg).forEach(r=>kids.push(new D.Paragraph({spacing:{line:480,after:0},indent:{left:720,hanging:720},children:[...(r.prefix?[new D.TextRun(r.prefix)]:[]),...r.segs.map(x=>typeof x==='string'?new D.TextRun(x):new D.TextRun({text:x.t,italics:true}))]})));
  kids.push(new D.Paragraph({spacing:{line:240,before:360,after:0},children:[new D.TextRun({text:`SaNaSoft was developed by ${DEVELOPERS}.`,italics:true,size:18})]}));
  const doc=new D.Document({creator:'SaNaSoft',title:`fsQCA results: ${d.out}`,styles:{default:{document:{run:{font:font[0],size:font[1]}}}},
    sections:[{properties:{page:{size:page,margin:{top:1440,right:1440,bottom:1440,left:1440}}},
      headers:{default:new D.Header({children:[new D.Paragraph({alignment:D.AlignmentType.RIGHT,children:[new D.TextRun({children:[D.PageNumber.CURRENT]})]})]})},children:kids}]});
  return D.Packer.toBlob(doc);
}
function exportBox(){
  const e=S.exp, c=(k,l,dis)=>`<label class="chip small ${e.inc[k]&&!dis?'on':''} ${dis?'dis':''}"><input type="checkbox" data-inc-exp="${k}" ${e.inc[k]&&!dis?'checked':''} ${dis?'disabled':''}>${l}</label>`;
  return `<div class="subblock"><div class="sub">Download your results</div>
    <p class="note">Choose a reference style for the citations and reference list. Tables and figures follow APA 7th edition style: numbered tables and figures with italic titles, horizontal rules only, notes below each table, and no leading zeros for proportions. Tables open as real Word tables you can edit.</p>
    <div class="fields"><label class="field">Paper size<select class="inp" id="xp-size" style="width:auto"><option value="letter" ${e.size==='letter'?'selected':''}>US Letter</option><option value="a4" ${e.size==='a4'?'selected':''}>A4</option></select></label>
    <label class="field">Reference style<select class="inp" id="xp-ref" style="width:auto">${REF_STYLES.map(([k,l])=>`<option value="${k}" ${e.style===k?'selected':''}>${l}</option>`).join('')}</select></label>
    <label class="field">Font<select class="inp" id="xp-font" style="width:auto"><option value="tnr" ${e.font==='tnr'?'selected':''}>Times New Roman 12 pt</option><option value="calibri" ${e.font==='calibri'?'selected':''}>Calibri 11 pt</option><option value="arial" ${e.font==='arial'?'selected':''}>Arial 11 pt</option></select></label></div>
    <div class="exportgrid">${c('methods','Methods paragraph')}${c('calib','Calibration table')}${c('nec','Must-have table')}${c('tt','Combination table')}${c('conf','Recipe table')}${c('rob','Robustness table',!S.robust)}${c('pred','Predictive table',!S.predict||S.predict.none)}${c('xy','XY plots')}${c('plain','Plain-language summary')}</div>
    ${!S.robust||!S.predict?'<p class="note">Run the robustness check and the predictive test above to include their tables.</p>':''}
    <div class="row"><button class="btn primary small" id="dl-word">Download Word report (APA 7)</button><button class="btn small" id="dl-xlsx">Download Excel workbook</button><button class="btn small" id="dl-proj">Save project</button></div></div>`;
}
function bindExport(){
  const sz=$('#xp-size'); if(!sz) return;
  sz.onchange=e=>{ S.exp.size=e.target.value; scheduleAutosave(); };
  $('#xp-font').onchange=e=>{ S.exp.font=e.target.value; scheduleAutosave(); };
  $('#xp-ref').onchange=e=>{ S.exp.style=e.target.value; render(); };
  $$('[data-inc-exp]').forEach(el=>el.onchange=()=>{ S.exp.inc[el.dataset.incExp]=el.checked; el.closest('label').classList.toggle('on',el.checked); scheduleAutosave(); });
  $('#dl-word').onclick=async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent='Preparing Word report…';
    try{ const blob=await buildDocx(); if(blob) await saveNumbered('Report',`${baseName()}_${S.negate?'low':'high'}_${S.outcome}`,'docx',blob); }
    catch(err){ toast('Could not build the Word report. Check your internet connection and try again.'); console.error(err); }
    b.disabled=false; b.textContent='Download Word report (APA 7)'; };
  $('#dl-xlsx').onclick=async()=>{ if(!window.XLSX){ toast('The Excel library could not load. Check your internet connection.'); return; } const buf=buildWorkbook(); if(buf) await saveNumbered('Results',`${baseName()}_${S.negate?'low':'high'}_${S.outcome}`,'xlsx',new Blob([buf])); };
  $('#dl-proj').onclick=saveProject;
}

function nextButtons(){
  const ps=plans(); if(!ps.length) return '';
  const items=[];
  ps.forEach((p,i)=>{ [false,true].forEach(neg=>{
    const same=p.result===S.outcome && neg===S.negate && p.factors.join()===S.conditions.join();
    if(!same && p.factors.length>=1 && p.factors.length<=10) items.push(`<button class="btn small" data-np="${i}" data-neg="${neg?1:0}">What leads to ${neg?'low':'high'} ${esc(p.result)}${p.kind==='whole'?' (whole model)':''}</button>`);
  }); });
  return items.length?`<div class="subblock"><div class="sub">Run your other analyses</div><p class="note">Your settings carry over. Each button runs straight through to the recipes; check steps 5 and 6 for each one too.</p><div class="row">${items.join('')}</div></div>`:'';
}
function bindNext(){ const ps=plans(); $$('[data-np]').forEach(b=>b.onclick=()=>startPlan(ps[+b.dataset.np], b.dataset.neg==='1', 6)); }
function symbol(c,core){
  const s=core?20:12;
  if(c==='1') return `<svg class="sym" width="${s}" height="${s}" viewBox="0 0 20 20" aria-label="high"><circle cx="10" cy="10" r="9" fill="var(--in)"/></svg>`;
  if(c==='0') return `<svg class="sym" width="${s}" height="${s}" viewBox="0 0 20 20" aria-label="low"><circle cx="10" cy="10" r="8" fill="none" stroke="var(--out)" stroke-width="2.2"/><path d="M5.8 5.8L14.2 14.2M14.2 5.8L5.8 14.2" stroke="var(--out)" stroke-width="2.2"/></svg>`;
  return '';
}
function methodsText(d,res,de,tt,map,reg){
  reg=reg||citeRegistry(S.exp.style); const citeSw=reg('sanasoft');
  const vs=[...d.names,S.outcome];
  const src=v=>S.calibSrc[v]||'custom';
  const pctV=vs.filter(v=>src(v)==='pct'), p90V=vs.filter(v=>src(v)==='pct90'), custV=vs.filter(v=>src(v)==='custom'), scaleV=vs.filter(v=>src(v)==='scale');
  const all=S.mode==='std'?'Because the latent variable scores were standardised, all constructs':'All constructs';
  let calTxt=''; const std=S.calStd==='r'?' (logistic transformation as implemented in the R QCA package, with full membership at 0.95)':' '+reg('ragin');
  if(scaleV.length){ const a=S.calib[scaleV[0]]; calTxt+=`${scaleV.length===vs.length?'All constructs were':lst(scaleV)+(scaleV.length>1?' were':' was')} calibrated using the direct method${std}, with ${a.full} as the threshold for full membership, ${a.cross} as the crossover point and ${a.non} as the threshold for full non-membership on the original ${S.scaleMin}–${S.scaleMax} scale. `; }
  if(pctV.length) calTxt+=`${pctV.length===vs.length?all:lst(pctV)} were calibrated using the direct method${std} with the 95th, 50th and 5th sample percentiles as thresholds for full membership, the crossover point and full non-membership. `;
  if(p90V.length) calTxt+=`${p90V.length===vs.length?all:lst(p90V)} ${p90V.length>1?'were':'was'} calibrated using the direct method${std} with the 90th, 50th and 10th sample percentiles as thresholds for full membership, the crossover point and full non-membership. `;
  if(custV.length) calTxt+=`${lst(custV)} ${custV.length>1?'were':'was'} calibrated using the direct method with construct-specific anchors (see Table X). `;
  const kept=tt.rows.filter(r=>r.n>=S.freq).reduce((s,r)=>s+r.n,0), tot=d.N-tt.ambiguous;
  const pres=d.names.filter((_,j)=>de[j]==='1'), abs=d.names.filter((_,j)=>de[j]==='0');
  const ex=[]; if(pres.length) ex.push(`${lst(pres)} would contribute to ${d.out} when present`); if(abs.length) ex.push(`${lst(abs)} would contribute when absent`);
  const I=res.inter;
  const multi=vs.some(v=>{ const c=S.constructs.find(x=>x.name===v); return (c&&c.items.length>1)||S.higher.some(h=>h.name===v); });
  const src0= S.mode==='std'?'using the latent variable scores from the PLS-SEM model as construct scores. ': multi?`with construct scores computed as the mean of their items on the original ${S.scaleMin}–${S.scaleMax} scale. `:'using the unstandardised latent variable scores from the PLS-SEM model as construct scores. ';
  return `We conducted fsQCA on ${d.N} respondents in SaNaSoft ${citeSw}, ` + src0 + calTxt +
    (S.fix05?`Membership scores of exactly 0.5 were recoded to 0.501 to avoid dropping cases at the crossover. `:'') +
    `The truth table for ${d.out} included ${d.names.length} conditions (${lst(d.names)}). Using a frequency threshold of ${S.freq}, which retained ${pc(kept/tot)} of cases, a raw consistency threshold of ${S.incl.toFixed(2)} and a PRI threshold of ${S.pri.toFixed(2)}, ${res.nPos} configuration${res.nPos===1?' was':'s were'} coded as sufficient. ` +
    (S.esa?`Following the Enhanced Standard Analysis ${reg('schneider')}, ${(()=>{ const a=(window._esa&&window._esa.csa.length)||0, b=window._esa?window._esa.necRows.filter(x=>!window._esa.csa.includes(x)).length:0; return `contradictory simplifying assumptions (${a}) and remainders contradicting a necessary condition (${b}) were excluded from the minimisation. `; })()}`:'') +
    (res.complex.nModels>1||res.pars.nModels>1?`Model ambiguity was present (${res.complex.nModels} complex and ${res.pars.nModels}${res.pars.capped?'+':''} parsimonious models); the reported intermediate solution is based on complex model ${res.complex.idx+1} and parsimonious model ${res.pars.idx+1}. `:'') +
    `The intermediate solution` + (ex.length?`, based on the directional expectations that ${ex.join(' and ')},`:'') +
    ` comprises ${I.terms.length} configuration${I.terms.length===1?'':'s'} with an overall solution consistency of ${f3(I.sol.incl)} and solution coverage of ${f3(I.sol.cov)}.`;
}
function drawCurve(){
  const box=$('#curve'); if(!box) return;
  const v=S.selCal; if(!v||!S.scores[v]){ box.innerHTML=''; return; }
  const a=S.calib[v], ok=validAnchors(a), sc=S.scores[v].filter(Number.isFinite);
  const W=640,H=250,L=44,R=16,T=18,B=38;
  const lo=S.std[v]?Math.floor(Math.min(...sc, ok?Math.min(a.non,a.full):Infinity)):Math.min(S.scaleMin,Math.floor(Math.min(...sc))), hi=S.std[v]?Math.ceil(Math.max(...sc, ok?Math.max(a.non,a.full):-Infinity)):Math.max(S.scaleMax,Math.ceil(Math.max(...sc)));
  const X=x=>L+(x-lo)/(hi-lo)*(W-L-R), Yp=y=>T+(1-y)*(H-T-B);
  const bins=24, bw=(hi-lo)/bins, cnt=new Array(bins).fill(0);
  sc.forEach(x=>{ const b=Math.min(bins-1,Math.max(0,Math.floor((x-lo)/bw))); cnt[b]++; });
  const mx=Math.max(...cnt,1);
  const hist=cnt.map((c,i)=>`<rect x="${X(lo+i*bw)+1}" y="${Yp(0)-c/mx*(H-T-B)*0.85}" width="${Math.max(1,(W-L-R)/bins-2)}" height="${c/mx*(H-T-B)*0.85}" fill="var(--line)" opacity=".75"/>`).join('');
  let curve='', marks='';
  if(ok){
    const pts=[]; for(let i=0;i<=160;i++){ const x=lo+(hi-lo)*i/160; pts.push(`${X(x).toFixed(1)},${Yp(cv(x,a)).toFixed(1)}`); }
    curve=`<polyline points="${pts.join(' ')}" fill="none" stroke="var(--in)" stroke-width="3" stroke-linejoin="round"/>`;
    const mk=(x,y,col,lab)=>`<line x1="${X(x)}" x2="${X(x)}" y1="${T}" y2="${Yp(0)}" stroke="${col}" stroke-dasharray="3 4" stroke-width="1.3"/><circle cx="${X(x)}" cy="${Yp(y)}" r="5" fill="${col}"/><text x="${X(x)+7}" y="${Yp(y)+(y>0.9?16:-8)}" font-size="12.5" fill="${col}" font-family="var(--sans)" font-weight="600">${lab}</text>`;
    marks=mk(a.non,cv(a.non,a),'var(--out)','Clearly low: '+a.non)+mk(a.cross,0.5,'var(--ink)','Middle: '+a.cross)+mk(a.full,cv(a.full,a),'var(--in)','Clearly high: '+a.full);
  }
  const ticks=[]; for(let t=Math.ceil(lo);t<=hi;t++) ticks.push(`<text x="${X(t)}" y="${H-B+18}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--sans)">${t}</text>`);
  const yt=[0,.5,1].map(y=>`<text x="${L-8}" y="${Yp(y)+4}" font-size="12" text-anchor="end" fill="var(--muted)" font-family="var(--sans)">${y}</text><line x1="${L}" x2="${W-R}" y1="${Yp(y)}" y2="${Yp(y)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const cal=ok?sc.map(x=>cv(x,a)):[];
  box.innerHTML=`<div class="curvehead"><div class="sub">${esc(v)}: from score to 0–1</div><div class="stats"><span>Median score <b>${f2(percentile(sc,.5))}</b></span>${ok?`<span>In the high group <b>${pc(cal.filter(c=>c>0.5).length/cal.length)}</b></span>`:''}</div></div>
    ${ok?'':'<div class="callout warn">The three points must run in order: clearly high, then middle, then clearly low.</div>'}
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Conversion curve for ${esc(v)}">${yt}${hist}${curve}${marks}${ticks.join('')}<text x="${(W+L)/2}" y="${H-4}" font-size="12" text-anchor="middle" fill="var(--muted)" font-family="var(--sans)">${S.std[v]?'Standardised score':'Score on your scale'} (grey bars show how your respondents are spread)</text></svg>
    <p class="note">The blue curve turns each score (along the bottom) into a 0–1 value (up the side).</p>`;
}
function renderRail(){
  const mr=maxReach();
  $('#rail').innerHTML=STEPS.map((s,i)=>`<button class="stepbtn ${i===S.step?'cur':''} ${i<S.step?'done':''}" data-step="${i}" ${i>mr?'disabled':''}><span class="n">${i+1}</span><span class="t">${s.title}</span></button>`).join('');
  $$('.stepbtn').forEach(b=>b.onclick=()=>{ S.step=+b.dataset.step; render(); scrollTop(); });
}
function scrollTop(){ try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(e){} }
function nextHint(){
  const mr=maxReach();
  if(S.step+1<=mr) return '';
  if(S.step===2) return 'Start one of the suggested analyses above to continue';
  if(S.step===3) return 'Fix the highlighted numbers to continue';
  return '';
}
function render(){
  if(S.step>maxReach()) S.step=maxReach();
  renderRail();
  const st=STEPS[S.step], mr=maxReach(), hint=nextHint();
  $('#main').innerHTML=`<section class="panel"><div class="phead"><div class="pn">Step ${S.step+1} of ${STEPS.length}</div><h2>${st.title}</h2></div>
    <div class="pgrid"><div class="pcontent">${st.render()}</div><aside class="guide">${st.guide}</aside></div>
    <div class="pnav">${S.step>0?'<button class="btn ghost" id="back">Back</button>':'<span></span>'}
    ${S.step<STEPS.length-1?`<div class="navr">${hint?`<span class="note">${hint}</span>`:''}<button class="btn primary" id="next" ${S.step+1>mr?'disabled':''}>Continue to ${STEPS[S.step+1].title.toLowerCase()}</button></div>`:''}</div></section>`;
  const b=$('#back'); if(b) b.onclick=()=>{ S.step--; render(); scrollTop(); };
  const n=$('#next'); if(n) n.onclick=()=>{ S.step++; render(); scrollTop(); };
  st.bind&&st.bind();
  const sp=$('#saveproj'); sp.hidden=!S.raw; sp.onclick=saveProject;
  scheduleAutosave();
}
$('#modalclose').onclick=()=>$('#modal').classList.remove('show');
const THEMEKEY='sanasoft:theme';
function applyTheme(t){ if(t==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme',t); }
(()=>{ let t='light'; try{ t=localStorage.getItem(THEMEKEY)||'light'; }catch(e){} applyTheme(t); const sel=$('#theme'); sel.value=t; sel.onchange=()=>{ applyTheme(sel.value); try{ localStorage.setItem(THEMEKEY,sel.value); }catch(e){} }; })();
try{ const a=localStorage.getItem(AUTOKEY); if(a){ const o=JSON.parse(a); if(o&&o.app==='SaNaSoft') S.autosaved={savedAt:o.savedAt,fileName:o.fileName}; } }catch(e){}
render();
(async()=>{ try{ if(window.claude&&typeof window.claude.use==='function'){ _dl=await window.claude.use('downloads'); } }catch(e){ _dl=null; } })();
